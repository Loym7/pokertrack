      if (!start || !end) return '';
      const [sh, sm] = start.split(':').map(Number);
      let [eh, em] = end.split(':').map(Number);
      if (eh < sh) eh += 24;
      const mins = (eh * 60 + em) - (sh * 60 + sm);
      return `${Math.floor(mins / 60)}h${String(mins % 60).padStart(2, '0')}`;

    // ─── TAB 1 — GRILLES PRÉ-ENREGISTRÉES ────────────────────────
    const EMPTY_TOURN = { name:'', room:'Winamax', startTime:'20:00', buyIn:5, field:'500-999', format:'PKO' };
    function GridsTab({ savedGrids, setSavedGrids }) {
      const [showCreate, setShowCreate]   = useState(false);
      const [gridForm, setGridForm]       = useState({ name:'', room:'' });
      const [editGridId, setEditGridId]   = useState(null);
      const [expandedId, setExpandedId]   = useState(null);
      const [addTournFor, setAddTournFor] = useState(null); // gridId
      const [tournForm, setTournForm]     = useState(EMPTY_TOURN);
      const [editTourn, setEditTourn]     = useState(null); // { gridId, tournId }
      const [importFor, setImportFor]     = useState(null); // gridId
      const [importSel, setImportSel]     = useState(new Set()); // Set of "srcGridId:tournId"

      const gset = k => v => setGridForm(f => ({ ...f, [k]: v }));
      const tset = k => v => setTournForm(f => ({ ...f, [k]: v }));

      const toggleImport = key => setImportSel(prev => {
        const next = new Set(prev); next.has(key) ? next.delete(key) : next.add(key); return next;
      });

      const toggleImportAll = (srcGrid) => {
        const keys = srcGrid.tournaments.map(t => `${srcGrid.id}:${t.id}`);
        setImportSel(prev => {
          const next = new Set(prev);
          const allSel = keys.every(k => next.has(k));
          keys.forEach(k => allSel ? next.delete(k) : next.add(k));
          return next;
        });
      };

      const doImport = gridId => {
        const targetGrid = savedGrids.find(g => String(g.id) === String(gridId));
        const forcedRoom = targetGrid?.room || null;
        const toAdd = [];
        importSel.forEach(key => {
          const sep = key.indexOf(':');
          const srcGridId = key.slice(0, sep);
          const tournId   = key.slice(sep + 1);
          const srcGrid = savedGrids.find(g => String(g.id) === srcGridId);
          const t = srcGrid?.tournaments.find(t => String(t.id) === tournId);
          if (t) toAdd.push({ ...t, id: uid(), room: forcedRoom || t.room });
        });
        if (toAdd.length) {
          setSavedGrids(gs => gs.map(g => String(g.id) === String(gridId)
            ? { ...g, tournaments: [...g.tournaments, ...toAdd] } : g));
        }
        setImportFor(null); setImportSel(new Set());
      };

      // ── Grid CRUD ──
      const saveGrid = () => {
        if (!gridForm.name.trim()) return;
        if (editGridId !== null) {
          setSavedGrids(gs => gs.map(g => g.id === editGridId ? { ...g, ...gridForm } : g));
        } else {
          setSavedGrids(gs => [...gs, { id: uid(), ...gridForm, tournaments: [] }]);
          setExpandedId(null);
        }
        setGridForm({ name:'', room:'' }); setEditGridId(null); setShowCreate(false);
      };

      const startEditGrid = (e, g) => {
        e.stopPropagation();
        setGridForm({ name: g.name, room: g.room||'' });
        setEditGridId(g.id); setShowCreate(true);
      };

      const deleteGrid = (e, id) => {
        e.stopPropagation();
        if (confirm('Supprimer cette grille et tous ses tournois ?'))
          setSavedGrids(gs => gs.filter(g => g.id !== id));
      };

      // ── Tournament CRUD inside a grid ──
      const saveTournament = gridId => {
        if (!tournForm.name.trim()) return;
        const tourn = { ...tournForm, buyIn: Number(tournForm.buyIn) };
        if (editTourn && editTourn.gridId === gridId) {
          setSavedGrids(gs => gs.map(g => g.id === gridId
            ? { ...g, tournaments: g.tournaments.map(t => t.id === editTourn.tournId ? { ...tourn, id: editTourn.tournId } : t) }
            : g));
          setEditTourn(null);
        } else {
          setSavedGrids(gs => gs.map(g => g.id === gridId
            ? { ...g, tournaments: [...g.tournaments, { ...tourn, id: uid() }] }
            : g));
        }
        setTournForm(EMPTY_TOURN); setAddTournFor(null);
      };

      const startEditTourn = (gridId, t) => {
        setTournForm({ name:t.name, room:t.room, startTime:t.startTime, buyIn:t.buyIn, field:t.field, format:t.format });
        setEditTourn({ gridId, tournId: t.id });
        setAddTournFor(gridId);
      };

      const deleteTourn = (gridId, tournId) => {
        setSavedGrids(gs => gs.map(g => g.id === gridId
          ? { ...g, tournaments: g.tournaments.filter(t => t.id !== tournId) }
          : g));
      };

      const cancelTournForm = () => { setTournForm(EMPTY_TOURN); setAddTournFor(null); setEditTourn(null); };

      return (
        <div className="p-4 space-y-4">
          {/* Header */}
          <div className="flex items-center justify-between">
            <h2 className="text-lg font-bold text-green-400">Grilles pré-enregistrées — {savedGrids.length}</h2>
            {!showCreate && (
              <Btn onClick={() => { setGridForm({ name:'', room:'' }); setEditGridId(null); setShowCreate(true); }}
                cls="bg-green-600 hover:bg-green-700 text-white">+ Créer une grille</Btn>
            )}
          </div>

          {/* Create / Edit grid form */}
          {showCreate && (
            <div className="bg-gray-800 border border-green-800 rounded-lg p-4">
              <h3 className="text-sm font-semibold text-green-400 mb-3">{editGridId ? '✏️ Modifier la grille' : '➕ Nouvelle grille'}</h3>
              <div className="flex flex-wrap gap-3">
                <div className="flex-1 min-w-48">
                  <label className="text-xs text-gray-400 block mb-1">Nom de la grille *</label>
                  <Inp value={gridForm.name} onChange={gset('name')} placeholder="Ex: Soirée PKO, Winamax..." cls="w-full" />
                </div>
                <div>
                  <label className="text-xs text-gray-400 block mb-1">Room (optionnel)</label>
                  <Sel value={gridForm.room||''} onChange={gset('room')} options={[{value:'',label:'Toutes rooms'}, ...ROOMS.map(r=>({value:r,label:r}))]} cls="w-full" />
                </div>
              </div>
              <div className="flex gap-2 mt-3">
                <Btn onClick={saveGrid} cls="bg-green-600 hover:bg-green-700 text-white">Sauvegarder</Btn>
                <Btn onClick={() => { setShowCreate(false); setEditGridId(null); }} cls="bg-gray-600 hover:bg-gray-700 text-white">Annuler</Btn>
              </div>
            </div>
          )}

          {/* Grid cards */}
          {savedGrids.length === 0 && (
            <div className="text-center py-16 text-gray-600">
              <div className="text-5xl mb-3">📋</div>
              <p className="text-sm">Aucune grille. Créez-en une pour commencer.</p>
            </div>
          )}

          {savedGrids.map(grid => {
            const isOpen = expandedId === grid.id;
            const isAddingHere = addTournFor === grid.id;
            return (
              <div key={grid.id} className="bg-gray-800 border border-gray-700 rounded-lg overflow-hidden">
                {/* Card header — clickable to expand */}
                <div className="flex items-center justify-between px-4 py-3 cursor-pointer hover:bg-gray-750 transition-colors select-none"
                  onClick={() => setExpandedId(isOpen ? null : grid.id)}>
                  <div className="flex items-center gap-3">
                    <span className="text-white font-semibold">{grid.name}</span>
                    {grid.room && <Badge cls={ROOM_CLS[grid.room]||'bg-gray-600 text-white'}>{grid.room}</Badge>}
                    <span className="text-gray-500 text-xs">{grid.tournaments.length} tournoi{grid.tournaments.length !== 1 ? 's' : ''}</span>
                  </div>
                  <div className="flex items-center gap-3">
                    <button onClick={e => startEditGrid(e, grid)} className="text-blue-400 hover:text-blue-200 text-sm" title="Renommer">✏️</button>
                    <button onClick={e => deleteGrid(e, grid.id)} className="text-red-400 hover:text-red-200 text-sm" title="Supprimer">🗑️</button>
                    <span className="text-gray-500 text-xs ml-1">{isOpen ? '▲' : '▼'}</span>
                  </div>
                </div>

                {/* Expanded content */}
                {isOpen && (
                  <div className="border-t border-gray-700">
                    {/* Tournament table */}
                    {grid.tournaments.length > 0 && (
                      <div className="overflow-x-auto">
                        <table className="w-full text-sm text-left">
                          <thead className="bg-gray-900 text-gray-400 text-xs uppercase">
                            <tr>
                              {['Nom','Room','Heure','Buy-In','Field','Format',''].map(h => (
                                <th key={h} className="px-3 py-2 whitespace-nowrap">{h}</th>
                              ))}
                            </tr>
                          </thead>
                          <tbody>
                            {[...grid.tournaments].sort((a,b) => (a.startTime||'').localeCompare(b.startTime||'')).map(t => (
                              <tr key={t.id} className="border-t border-gray-700 hover:bg-gray-700/40 transition-colors">
                                <td className="px-3 py-2 font-medium text-white">{t.name}</td>
                                <td className="px-3 py-2"><Badge cls={ROOM_CLS[t.room]}>{t.room}</Badge></td>
                                <td className="px-3 py-2 text-gray-300">{t.startTime}</td>
                                <td className="px-3 py-2 text-gray-300">{t.buyIn}€</td>
                                <td className="px-3 py-2 text-gray-400 text-xs">{t.field}</td>
                                <td className="px-3 py-2"><Badge cls={FMT_CLS[t.format]}>{t.format}</Badge></td>
                                <td className="px-3 py-2">
                                  <div className="flex gap-2">
                                    <button onClick={() => startEditTourn(grid.id, t)} className="text-blue-400 hover:text-blue-200 text-sm">✏️</button>
                                    <button onClick={() => deleteTourn(grid.id, t.id)} className="text-red-400 hover:text-red-200 text-sm">🗑️</button>
                                  </div>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}

                    {grid.tournaments.length === 0 && !isAddingHere && (
                      <p className="text-xs text-gray-600 px-4 py-3">Aucun tournoi dans cette grille.</p>
                    )}

                    {/* Add / Edit tournament form */}
                    {isAddingHere && (
                      <div className="bg-gray-900/60 border-t border-gray-700 px-4 py-3">
                        <p className="text-xs font-semibold text-green-400 mb-2">{editTourn ? '✏️ Modifier le tournoi' : '➕ Ajouter un tournoi'}</p>
                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-2">
                          <div className="col-span-2">
                            <label className="text-xs text-gray-500 block mb-0.5">Nom *</label>
                            <Inp value={tournForm.name} onChange={tset('name')} placeholder="Nom du tournoi" cls="w-full" />
                          </div>
                          <div>
                            <label className="text-xs text-gray-500 block mb-0.5">Room</label>
                            {grid.room
                              ? <div className="flex items-center h-8 px-2">
                                  <Badge cls={ROOM_CLS[grid.room]||'bg-gray-600 text-white'}>{grid.room}</Badge>
                                </div>
                              : <Sel value={tournForm.room} onChange={tset('room')} options={ROOMS} cls="w-full" />
                            }
                          </div>
                          <div>
                            <label className="text-xs text-gray-500 block mb-0.5">Heure</label>
                            <Inp type="time" value={tournForm.startTime} onChange={tset('startTime')} cls="w-full" />
                          </div>
                          <div>
                            <label className="text-xs text-gray-500 block mb-0.5">Buy-In</label>
                            <Sel value={tournForm.buyIn} onChange={tset('buyIn')} options={BUY_INS.map(b => ({ value:b, label:`${b}€` }))} cls="w-full" />
                          </div>
                          <div>
                            <label className="text-xs text-gray-500 block mb-0.5">Field</label>
                            <Sel value={tournForm.field} onChange={tset('field')} options={FIELDS} cls="w-full" />
                          </div>
                          <div>
                            <label className="text-xs text-gray-500 block mb-0.5">Format</label>
                            <Sel value={tournForm.format} onChange={tset('format')} options={FORMATS} cls="w-full" />
                          </div>
                        </div>
                        <div className="flex gap-2 mt-2">
                          <Btn onClick={() => saveTournament(grid.id)} cls="bg-green-600 hover:bg-green-700 text-white text-xs">
                            {editTourn ? 'Modifier' : 'Ajouter'}
                          </Btn>
                          <Btn onClick={cancelTournForm} cls="bg-gray-600 hover:bg-gray-700 text-white text-xs">Annuler</Btn>
                        </div>
                      </div>
                    )}

                    {/* Import panel */}
                    {importFor === grid.id && (
                      <div className="bg-gray-900/80 border-t border-gray-700 px-4 py-3">
                        <div className="flex items-center justify-between mb-3">
                          <p className="text-xs font-semibold text-blue-400">📥 Importer depuis une autre grille</p>
                          {importSel.size > 0 && <span className="text-xs text-blue-300">{importSel.size} sélectionné{importSel.size > 1 ? 's' : ''}</span>}
                        </div>
                        {(() => {
                          const otherGrids = savedGrids
                            .filter(g => String(g.id) !== String(grid.id))
                            .map(g => ({
                              ...g,
                              tournaments: grid.room
                                ? g.tournaments.filter(t => t.room === grid.room)
                                : g.tournaments,
                            }))
                            .filter(g => g.tournaments.length > 0);
                          if (otherGrids.length === 0) return (
                            <p className="text-xs text-gray-600 italic">
                              {grid.room
                                ? `Aucun tournoi ${grid.room} disponible dans les autres grilles.`
                                : 'Aucun tournoi disponible dans les autres grilles.'}
                            </p>
                          );
                          return (
                          <div className="space-y-4 max-h-72 overflow-y-auto pr-1">
                              {otherGrids.map(srcGrid => {
                                const allSel = srcGrid.tournaments.every(t => importSel.has(`${srcGrid.id}:${t.id}`));
                                return (
                                  <div key={srcGrid.id}>
                                    <div className="flex items-center gap-2 mb-1.5">
                                      <span className="text-xs font-semibold text-gray-300">{srcGrid.name}</span>
                                      {srcGrid.room && <Badge cls={ROOM_CLS[srcGrid.room]||'bg-gray-600 text-white'}>{srcGrid.room}</Badge>}
                                      <button onClick={() => toggleImportAll(srcGrid)}
                                        className="text-xs text-gray-500 hover:text-blue-400 underline ml-1 transition-colors">
                                        {allSel ? 'Tout désélectionner' : 'Tout sélectionner'}
                                      </button>
                                    </div>
                                    <div className="flex flex-wrap gap-1.5 pl-2">
                                      {srcGrid.tournaments.map(t => {
                                        const key = `${srcGrid.id}:${t.id}`;
                                        const sel = importSel.has(key);
                                        return (
                                          <button key={t.id} onClick={() => toggleImport(key)}
                                            className={`flex items-center gap-1.5 px-2 py-1 rounded text-xs border transition-all ${sel ? 'bg-blue-700 border-blue-500 text-white' : 'bg-gray-800 border-gray-600 text-gray-300 hover:border-blue-500'}`}>
                                            <span className="font-medium">{t.name}</span>
                                            <span className="opacity-60">{t.startTime}</span>
                                            <span className={`font-mono ${sel ? 'text-blue-200' : 'text-cyan-400'}`}>{t.buyIn}€</span>
                                            <Badge cls={FMT_CLS[t.format]||'bg-gray-600 text-white'}>{t.format}</Badge>
                                          </button>
                                        );
                                      })}
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          );
                        })()}
                        <div className="flex gap-2 mt-3">
                          <Btn onClick={() => doImport(grid.id)} cls={`text-white text-xs ${importSel.size ? 'bg-blue-600 hover:bg-blue-700' : 'bg-gray-600 cursor-not-allowed opacity-50'}`}>
                            {importSel.size ? `Importer ${importSel.size} tournoi${importSel.size > 1 ? 's' : ''}` : 'Importer'}
                          </Btn>
                          <Btn onClick={() => { setImportFor(null); setImportSel(new Set()); }} cls="bg-gray-600 hover:bg-gray-700 text-white text-xs">Annuler</Btn>
                        </div>
                      </div>
                    )}

                    {/* Footer actions */}
                    {!isAddingHere && importFor !== grid.id && (
                      <div className="px-4 py-2 border-t border-gray-700/50 flex gap-2">
                        <Btn onClick={() => { setTournForm({ ...EMPTY_TOURN, room: grid.room || 'Winamax' }); setEditTourn(null); setAddTournFor(grid.id); }}
                          cls="bg-gray-700 hover:bg-gray-600 text-green-400 text-xs">+ Ajouter un tournoi</Btn>
                        {savedGrids.some(g => String(g.id) !== String(grid.id) && g.tournaments.length > 0) && (
                          <Btn onClick={() => { setImportFor(grid.id); setImportSel(new Set()); }}
                            cls="bg-gray-700 hover:bg-gray-600 text-blue-400 text-xs">📥 Importer depuis une grille</Btn>
                        )}
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    // ─── TAB 2 — GRILLE DU JOUR ───────────────────────────────────
    const EMPTY_PONCT = { name:'', room:'Winamax', startTime:'20:00', buyIn:5, field:'500-999', format:'PKO' };

    function DailyGridTab({ savedGrids, setSavedGrids, setPlayedTournaments, sessions, setSessions, playedTournaments }) {
      const [date, setDate]             = useState(todayStr);
      const [typeSession, setTypeSession] = useState('Soir');
      const [selectedGridIds, setSelIds]  = useState(new Set());
      const [timeFrom, setTimeFrom]       = useState('');
      const [timeTo, setTimeTo]           = useState('');
      const [rows, setRows]             = useState([]);
      const [generated, setGen]         = useState(false);
      const [showPonct, setShowP]       = useState(false);
      const [ponct, setPonct]           = useState(EMPTY_PONCT);
      const [addToGridId, setAddToGridId] = useState('');
      const [validated, setVal]         = useState(false);
      const [summary, setSummary]       = useState(null);
      const dragIdx = useRef(null);

      const toggleGrid = id => {
        setSelIds(prev => {
          const next = new Set(prev);
          next.has(id) ? next.delete(id) : next.add(id);
          return next;
        });
      };

      const loadGrid = () => {
        const selected = savedGrids.filter(g => selectedGridIds.has(String(g.id)));
        const seen = new Set();
        const source = selected.flatMap(g => g.tournaments).filter(t => {
          if (seen.has(t.id)) return false;
          seen.add(t.id);
          if (timeFrom && (t.startTime||'') < timeFrom) return false;
          if (timeTo   && (t.startTime||'') > timeTo)   return false;
          return true;
        });
        setRows(source.map(t => ({
          _gid: uid(), libId: t.id, name: t.name, room: t.room,
          startTime: t.startTime, buyIn: t.buyIn, field: t.field,
          format: t.format,
          favorite: false, entry: false, reEntry: false, itm: false, done: false, gains: 0,
        })).sort((a, b) => (a.room||'').localeCompare(b.room||'')));
        setGen(true); setVal(false);
      };

      const upd = (gid, k, v) => setRows(r => r.map(x => x._gid === gid ? { ...x, [k]: v } : x));
      const del  = gid => setRows(r => r.filter(x => x._gid !== gid));
      const pSet = k => v => setPonct(f => ({ ...f, [k]: v }));

      const addPonct = () => {
        if (!ponct.name.trim()) return;
        setRows(r => [...r, {
          _gid: uid(), libId: null, ...ponct,
          buyIn: Number(ponct.buyIn),
          favorite: false, entry: false, reEntry: false, itm: false, done: false, gains: 0,
        }]);
        if (addToGridId) {
          setSavedGrids(gs => gs.map(g => String(g.id) !== addToGridId ? g : {
            ...g,
            tournaments: [...g.tournaments, {
              id: uid(), name: ponct.name, room: g.room || ponct.room,
              startTime: ponct.startTime, buyIn: Number(ponct.buyIn),
              field: ponct.field, format: ponct.format,
            }],
          }));
        }
        setPonct(EMPTY_PONCT); setAddToGridId(''); setShowP(false);
      };

      const validate = () => {
        const played = rows.filter(r => r.entry);
        if (!played.length) { alert('Aucun tournoi coché (Entry).'); return; }

        // Crée toujours une nouvelle session Grind
        const newNum = sessions.filter(s => s.type === 'Grind').reduce((max, s) => {
          const n = parseInt(s.code.replace('G', ''), 10);
          return isNaN(n) ? max : Math.max(max, n);
        }, 0) + 1;
        const sess = {
          id: uid(),
          code: `G${newNum}`,
          date,
          type: 'Grind',
          start: '', end: '',
          typeSession,
          hands: 0,
          duration: '',
        };
        setSessions(prev => [...prev, sess]);

        const newTourns = played.map(r => ({
          id: uid(), date, session: sess.code,
          room: r.room, buyIn: r.buyIn, entry: true, reEntry: r.reEntry,
          field: r.field, format: r.format, itm: r.itm,
          gains: Number(r.gains), nbEntry: r.reEntry ? 2 : 1,
          profit: Math.round((Number(r.gains) - r.buyIn * (r.reEntry ? 2 : 1)) * 100) / 100,
        }));
        setPlayedTournaments(prev => [...prev, ...newTourns]);
        setVal(true);

        // ── Calcul du résumé ──
        const invest  = newTourns.reduce((a, t) => a + t.buyIn * t.nbEntry, 0);
        const gains   = newTourns.reduce((a, t) => a + t.gains, 0);
        const profit  = Math.round((gains - invest) * 100) / 100;
        const nb      = newTourns.length;
        const itmN    = newTourns.filter(t => t.itm).length;
        const totalEntries = newTourns.reduce((a, t) => a + t.nbEntry, 0);
        const abi     = totalEntries > 0 ? Math.round((invest / totalEntries) * 100) / 100 : 0;
        const itmRate = Math.round(itmN / totalEntries * 100);
        const reEntries = newTourns.reduce((a, t) => a + Math.max(0, t.nbEntry - 1), 0);
        const roi     = invest > 0 ? Math.round(profit / invest * 100) : 0;

        // Percentile : position parmi les sessions précédentes
        const grindSess = sessions.filter(s => s.type === 'Grind');
        const pastProfits = grindSess.map(s => {
          const t = playedTournaments.filter(t => t.session === s.code);
          return t.reduce((a, t) => a + t.profit, 0);
        }).filter((_, i) => grindSess[i].code !== sess.code);
        const below = pastProfits.filter(p => p < profit).length;
        const pct   = pastProfits.length > 0 ? Math.round(below / pastProfits.length * 100) : null;

        setSummary({ invest, gains, profit, nb, abi, itmRate, itmN, totalEntries, reEntries, roi, pct, sessCode: sess.code });
      };

      const onDragStart = (e, i) => { dragIdx.current = i; e.dataTransfer.effectAllowed = 'move'; };
      const onDragOver  = e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
      const onDrop      = (e, i) => {
        e.preventDefault();
        const from = dragIdx.current;
        if (from === null || from === i) return;
        setRows(r => {
          const copy = [...r];
          const [item] = copy.splice(from, 1);
          copy.splice(i, 0, item);
          return copy;
        });
        dragIdx.current = null;
      };

      return (
      <>
        <div className="p-4 space-y-4">
          <div className="flex flex-wrap items-end gap-3">
            <div>
              <p className="text-xs text-gray-500 mb-1">Date</p>
              <input type="date" value={date} onChange={e => setDate(e.target.value)}
                className="bg-gray-700 border border-gray-600 rounded px-2 py-1 text-sm text-white focus:outline-none focus:border-green-500" />
            </div>
            <div>
              <p className="text-xs text-gray-500 mb-1">Moment</p>
              <Sel value={typeSession} onChange={setTypeSession}
                options={['Jour','Soir']} />
            </div>
            <div className="flex-1 min-w-64">
              <p className="text-xs text-gray-500 mb-1">Grilles ({selectedGridIds.size} sélectionnée{selectedGridIds.size > 1 ? 's' : ''})</p>
              <div className="flex flex-wrap gap-1.5">
                {savedGrids.map(g => {
                  const sel = selectedGridIds.has(String(g.id));
                  return (
                    <button key={g.id} onClick={() => toggleGrid(String(g.id))}
                      className={`px-2 py-1 rounded text-xs font-medium border transition-colors ${sel ? 'bg-green-600 border-green-500 text-white' : 'bg-gray-700 border-gray-600 text-gray-300 hover:border-green-500'}`}>
                      {g.name}
                      {g.room && <span className="ml-1 opacity-70">· {g.room}</span>}
                      <span className="ml-1 opacity-60">({g.tournaments.length})</span>
                    </button>
                  );
                })}
              </div>
            </div>
            <div>
              <p className="text-xs text-gray-500 mb-1">Plage horaire</p>
              <div className="flex items-center gap-1">
                <input type="time" value={timeFrom} onChange={e => setTimeFrom(e.target.value)}
                  className="bg-gray-700 border border-gray-600 rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-green-500 w-24" />
                <span className="text-gray-500 text-xs">→</span>
                <input type="time" value={timeTo} onChange={e => setTimeTo(e.target.value)}
                  className="bg-gray-700 border border-gray-600 rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-green-500 w-24" />
              </div>
            </div>
            <Btn onClick={loadGrid} cls="bg-green-600 hover:bg-green-700 text-white font-semibold">⚡ Charger</Btn>
            {generated && (
              <Btn onClick={() => setShowP(v => !v)} cls="bg-gray-600 hover:bg-gray-700 text-white">+ Ajout ponctuel</Btn>
            )}
            {validated && <span className="text-green-400 text-sm font-semibold self-center">✓ Journée validée</span>}
          </div>
          {generated && (
            <div className="flex items-center gap-2 text-xs text-gray-500">
              <span>📋</span>
              <span>
                {selectedGridIds.size > 0
                  ? <>{selectedGridIds.size} grille{selectedGridIds.size > 1 ? 's' : ''} chargée{selectedGridIds.size > 1 ? 's' : ''} — <span className="text-green-400">{rows.length} tournois</span>{(timeFrom||timeTo) && <span className="text-gray-400"> · {timeFrom||'00:00'} → {timeTo||'23:59'}</span>}</>
                  : 'Grille vide — ajoutez des tournois ponctuels'}
              </span>
            </div>
          )}

          {showPonct && (
            <div className="bg-gray-800 border border-gray-700 rounded-lg p-3">
              <p className="text-xs font-semibold text-gray-400 mb-2">Tournoi ponctuel</p>
              <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-2">
                <div className="col-span-2">
                  <Inp value={ponct.name} onChange={pSet('name')} placeholder="Nom du tournoi" cls="w-full" />
                </div>
                <Sel value={ponct.room} onChange={pSet('room')} options={ROOMS} cls="w-full" />
                <Inp type="time" value={ponct.startTime} onChange={pSet('startTime')} cls="w-full" />
                <Sel value={ponct.buyIn} onChange={pSet('buyIn')} options={BUY_INS.map(b => ({ value:b, label:`${b}€` }))} cls="w-full" />
                <Sel value={ponct.field} onChange={pSet('field')} options={FIELDS} cls="w-full" />
                <Sel value={ponct.format} onChange={pSet('format')} options={FORMATS} cls="w-full" />
              </div>
              {savedGrids.length > 0 && (
                <div className="mt-2 max-w-xs">
                  <label className="text-xs text-gray-500 block mb-0.5">Ajouter aussi à une grille</label>
                  <Sel value={addToGridId} onChange={setAddToGridId}
                    options={[{ value:'', label:'Aucune' }, ...savedGrids.map(g => ({ value:String(g.id), label: g.name + (g.room ? ` · ${g.room}` : '') }))]}
                    cls="w-full" />
                </div>
              )}
              <div className="flex gap-2 mt-2">
                <Btn onClick={addPonct} cls="bg-green-600 hover:bg-green-700 text-white text-xs">Ajouter</Btn>
                <Btn onClick={() => setShowP(false)} cls="bg-gray-600 hover:bg-gray-700 text-white text-xs">Annuler</Btn>
              </div>
            </div>
          )}

          {!generated ? (
            <div className="text-center py-20 text-gray-600">
              <div className="text-5xl mb-3">📅</div>
              <p className="text-sm">Sélectionnez une date, choisissez une grille et cliquez sur "Charger"</p>
              <p className="text-xs mt-1 text-gray-700">{savedGrids.length} grille{savedGrids.length !== 1 ? 's' : ''} pré-enregistrée{savedGrids.length !== 1 ? 's' : ''} disponible{savedGrids.length !== 1 ? 's' : ''}</p>
            </div>
          ) : (
            <>
              {/* ── Zone 1 : Grille template ── */}
              <div className="space-y-2">
                <p className="text-xs font-semibold text-gray-400 uppercase tracking-wide">
                  Disponibles — {rows.filter(r => !r.entry).length} tournois
                </p>
                {rows.filter(r => !r.entry).length === 0
                  ? <p className="text-xs text-gray-600 italic">Tous les tournois sont en jeu</p>
                  : <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {Object.entries(
                      rows.filter(r => !r.entry).reduce((acc, r) => {
                        (acc[r.room] = acc[r.room] || []).push(r);
                        return acc;
                      }, {})
                    ).map(([room, tourns]) => (
                      <div key={room} className="bg-gray-800/40 rounded-lg p-3 border border-gray-700/50">
                        <div className="flex items-center gap-2 mb-2">
                          <span className={`text-xs font-bold px-2 py-0.5 rounded ${ROOM_CLS[room] || 'bg-gray-700 text-gray-300'}`}>{room}</span>
                          <div className="flex-1 h-px bg-gray-700" />
                          <span className="text-xs text-gray-600">{tourns.length}</span>
                        </div>
                        <div className="space-y-2 pl-1">
                          {Object.entries(
                            tourns.reduce((acc, r) => {
                              const h = (r.startTime || '00:00').slice(0, 2);
                              (acc[h] = acc[h] || []).push(r);
                              return acc;
                            }, {})
                          ).sort(([a], [b]) => a.localeCompare(b)).map(([hour, hrs]) => (
                            <div key={hour} className="flex items-start gap-2">
                              <span className="text-xs text-gray-500 font-mono w-8 pt-2 flex-shrink-0">{hour}h</span>
                              <div className="flex flex-wrap gap-2 flex-1">
                                {hrs.map(r => (
                                  <button key={r._gid}
                                    onClick={() => upd(r._gid, 'entry', true)}
                                    className="group flex items-center gap-2 bg-gray-800 border border-gray-700 hover:border-green-500 hover:bg-green-900/20 rounded-lg px-3 py-2 text-left transition-all">
                                    <div className="flex flex-col min-w-0">
                                      <div className="flex items-center gap-1.5 flex-wrap">
                                        {r.favorite && <span className="text-yellow-400 text-xs">★</span>}
                                        <span className="text-white text-xs font-semibold truncate max-w-32">{r.name}</span>
                                        <Badge cls={FMT_CLS[r.format]}>{r.format}</Badge>
                                        <Badge cls={PRIO_CLS[r.priority]}>{r.priority}</Badge>
                                      </div>
                                      <div className="flex items-center gap-2 mt-0.5">
                                        <span className="text-gray-400 text-xs">{r.startTime}</span>
                                        <span className="text-cyan-400 text-xs font-medium">{r.buyIn}€</span>
                                        <span className="text-gray-500 text-xs">{r.field}</span>
                                      </div>
                                    </div>
                                    <span className="text-green-500 group-hover:text-green-300 text-lg font-bold ml-1 flex-shrink-0">+</span>
                                  </button>
                                ))}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                }
              </div>

              {/* ── Zone 2 : En jeu ── */}
              <div className="space-y-2">
                <div className="flex items-center gap-2">
                  <p className="text-xs font-semibold text-green-400 uppercase tracking-wide">En jeu</p>
                  <span className="text-xs bg-green-900/40 text-green-400 px-2 py-0.5 rounded-full">{rows.filter(r => r.entry && !r.done).length}</span>
                </div>
                {rows.filter(r => r.entry && !r.done).length === 0
                  ? <p className="text-xs text-gray-600 italic">Cliquez sur un tournoi ci-dessus pour le lancer</p>
                  : <div className="overflow-x-auto rounded-lg border border-green-900">
                    <table className="w-full text-sm text-left" style={{ minWidth: '680px' }}>
                      <thead className="bg-green-950/50 text-gray-400 text-xs uppercase">
                        <tr>
                          <th className="px-2 py-2">Tournoi</th>
                          <th className="px-2 py-2">Room</th>
                          <th className="px-2 py-2">BI</th>
                          <th className="px-2 py-2">Re-Entry</th>
                          <th className="px-2 py-2">ITM</th>
                          <th className="px-2 py-2">Gains (€)</th>
                          <th className="px-2 py-2">Terminé</th>
                          <th className="px-2 py-2 w-6"></th>
                        </tr>
                      </thead>
                      <tbody>
                        {rows.filter(r => r.entry && !r.done).map(r => (
                          <tr key={r._gid} className="border-t border-green-900/50 hover:bg-gray-800/50">
                            <td className="px-2 py-2">
                              <div className="flex items-center gap-1.5">
                                <span className="text-white font-medium text-xs">{r.name}</span>

                            </td>
                          </tr>

                      </tbody>
                    </table>
                  </div>
                }
              </div>

              {/* ── Zone 3 : Terminés ── */}
              {rows.filter(r => r.entry && r.done).length > 0 && (

                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2">
                    {rows.filter(r => r.entry && r.done).map(r => {
                      const cost   = r.buyIn * (r.reEntry ? 2 : 1);
                      const profit = Math.round((Number(r.gains) - cost) * 100) / 100;
                      return (
                        <div key={r._gid} className="bg-gray-800/50 border border-gray-700/50 rounded-lg px-3 py-2 flex items-center justify-between gap-2">

                                {profit >= 0 ? '+' : ''}{profit.toFixed(2)}€

                          <button onClick={() => upd(r._gid, 'done', false)}

        </div>

        {/* ── Popup récap session ── */}
        {summary && (
          <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
            <div className="bg-gray-800 border border-gray-700 rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-5">
              {/* Header */}
              <div className="flex items-center justify-between">
                <div>
                  <h3 className="text-lg font-bold text-white">Récap session <span className="text-green-400 font-mono">{summary.sessCode}</span></h3>
                  <p className="text-xs text-gray-500">{date}</p>
                </div>
                <span className={`text-2xl font-bold ${summary.profit >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                  {summary.profit >= 0 ? '+' : ''}{summary.profit.toFixed(2)}€

              <div className="grid grid-cols-2 gap-3">
                {[
                  { label:'Dépenses', value:`${summary.invest.toFixed(2)}€`, color:'text-red-300' },
                  { label:'Gains bruts', value:`${summary.gains.toFixed(2)}€`, color:'text-green-300' },
                  { label:'Tournois joués', value:summary.nb, color:'text-white' },
                  { label:'Re-entries', value:summary.reEntries, color:'text-orange-400' },
                  { label:'ABI', value:`${summary.abi.toFixed(2)}€`, color:'text-cyan-400' },
                  { label:'ROI', value:`${summary.roi}%`, color: summary.roi >= 0 ? 'text-green-400' : 'text-red-400' },
                  { label:'ITM', value:`${summary.itmN}/${summary.totalEntries} (${summary.itmRate}%)`, color:'text-yellow-400' },
                  { label:'Résultat net', value:`${summary.profit >= 0 ? '+' : ''}${summary.profit.toFixed(2)}€`, color: summary.profit >= 0 ? 'text-green-400' : 'text-red-400' },

                    <p className="text-xs text-gray-500 mb-1">{label}</p>
                    <p className={`text-lg font-bold ${color}`}>{value}</p>
                  </div>
                ))}

              {summary.pct !== null && (

                    <div className="flex-1 bg-gray-700 rounded-full h-2.5">
                      <div className={`h-2.5 rounded-full transition-all ${summary.pct >= 50 ? 'bg-green-500' : 'bg-red-500'}`}

      const saveEdit = () => {
        setSessions(prev => prev.map(s => s.id === editId ? {
          ...s,
          date: editForm.date || s.date,
          start: editForm.start,
          end: editForm.end,
          duration: calcDuration(editForm.start, editForm.end),
          typeSession: editForm.typeSession || s.typeSession,
        } : s));
        setEditId(null); setEditForm({});
      };

      const emptyF = { type:'Grind', date:todayStr, start:'18:00', end:'23:00', hands:0, typeSession:'Soir' };
      const [form, setForm] = useState(emptyF);
      const set = k => v => setForm(f => ({ ...f, [k]: v }));

      const save = () => {
        const prefix  = form.type === 'Grind' ? 'G' : 'T';
        const newNum  = sessions.filter(s => s.type === form.type).reduce((max, s) => {
          const n = parseInt(s.code.replace(/[GT]/, ''), 10);
          return isNaN(n) ? max : Math.max(max, n);
        }, 0) + 1;
        setSessions(prev => [...prev, {
          id: uid(), code: `${prefix}${newNum}`, ...form,
          hands: Number(form.hands),
          typeSession: form.typeSession || 'Soir',
          duration: calcDuration(form.start, form.end),
        }]);
        setForm(emptyF); setShow(false);
      };

      const sortedTourns = useMemo(() => {
        return [...playedTournaments].sort((a, b) => {
          const an = parseInt((a.session||'').replace(/[A-Za-z]/g,''), 10) || 0;
          const bn = parseInt((b.session||'').replace(/[A-Za-z]/g,''), 10) || 0;
          return bn - an;
        });
      }, [playedTournaments]);
      useEffect(() => { setPage(1); }, [sortedTourns]);
      const totalPages   = Math.ceil(sortedTourns.length / PER_PAGE);
      const pageStartIdx = (page - 1) * PER_PAGE;
      const pageData     = sortedTourns.slice(pageStartIdx, pageStartIdx + PER_PAGE);

      return (
        <>
        <div className="p-4 space-y-4">
          <div className="flex gap-1 border-b border-gray-700">
            {[['grind','Sessions Grind'],['travail','Sessions Travail'],['tournois','Tournois Joués']].map(([k,l]) => (
              <button key={k} onClick={() => { setSub(k); setPage(1); }}
                className={`px-5 py-2.5 text-sm font-medium border-b-2 -mb-px transition-colors
                  ${sub===k
                    ? k==='grind'    ? 'border-green-500 text-green-400'
                    : k==='travail'  ? 'border-blue-500 text-blue-400'
                    : k==='expresso' ? 'border-cyan-500 text-cyan-400'
                    :                  'border-purple-500 text-purple-400'
                    : 'border-transparent text-gray-400 hover:text-white'}`}>
                {l}
              </button>
            ))}
          </div>

          {/* ── Onglet Sessions Grind ── */}
          {sub === 'grind' && (
            <div className="space-y-3">
              <div className="flex justify-between items-center">
                <span className="text-gray-300 text-sm">
                  <span className="text-green-400 font-semibold">{sessions.filter(s=>s.type==='Grind').length}</span> sessions Grind
                  {(() => {
                    const existingCodes = new Set(sessions.map(s => s.code));
                    const orphaned = [...new Set(playedTournaments.map(t => t.session))].filter(c => c && !existingCodes.has(c));
                    if (!orphaned.length) return null;
                    return (
                      <button onClick={() => {
                        setSessions(prev => {
                          const prevCodes = new Set(prev.map(s => s.code));
                          const toAdd = orphaned.filter(c => !prevCodes.has(c)).map(code => ({
                            id: uid(), code,
                            date: playedTournaments.filter(t => t.session === code)[0]?.date || todayStr,
                            type: code.startsWith('G') ? 'Grind' : 'Travail',
                            start: '', end: '', typeSession: 'Jour', hands: 0, duration: '',
                          }));
                          return toAdd.length ? [...prev, ...toAdd] : prev;
                        });
                      }} className="ml-3 px-2 py-1 text-xs bg-yellow-600 hover:bg-yellow-500 text-white rounded font-medium">
                        ⚠ Réparer {orphaned.length} session{orphaned.length > 1 ? 's' : ''} manquante{orphaned.length > 1 ? 's' : ''}
                      </button>
                    );
                  })()}
                </span>
                {!showForm && (
                  <Btn onClick={() => { setForm({...emptyF, type:'Grind', date:toStr(new Date())}); setShow(true); }} cls="bg-green-600 hover:bg-green-700 text-white">+ Nouvelle session</Btn>
                )}
              </div>

              {showForm && form.type === 'Grind' && (
                <div className="bg-gray-800 border border-gray-700 rounded-lg p-3">

                    <div>
                      <label className="text-xs text-gray-400 block mb-1">Date</label>
                      <Inp type="date" value={form.date} onChange={set('date')} cls="w-full" />
                    </div>
                    <div>
                      <label className="text-xs text-gray-400 block mb-1">Début</label>
                      <Inp type="time" value={form.start} onChange={set('start')} cls="w-full" />
                    </div>
                    <div>
                      <label className="text-xs text-gray-400 block mb-1">Fin</label>
                      <Inp type="time" value={form.end} onChange={set('end')} cls="w-full" />

                    <div>
                      <label className="text-xs text-gray-400 block mb-1">Moment</label>
                      <Sel value={form.typeSession||'Soir'} onChange={set('typeSession')} options={['Jour','Soir','Live']} cls="w-full" />

                  <div className="mt-2 text-xs text-gray-500">
                    Durée calculée : {calcDuration(form.start, form.end)}

                    <Btn onClick={save} cls="bg-green-600 hover:bg-green-700 text-white">Sauvegarder</Btn>
                    <Btn onClick={() => setShow(false)} cls="bg-gray-600 hover:bg-gray-700 text-white">Annuler</Btn>
                  </div>

              <div className="overflow-x-auto rounded-lg border border-gray-700">

                  <thead className="bg-gray-800 text-gray-400 text-xs uppercase">
                    <tr>{['ID','Date','Moment','Début','Fin','Durée','Résultat',''].map(h=>(
                      <th key={h} className="px-3 py-2 text-left">{h}</th>

                  </thead>
                  <tbody>
                    {[...sessions].filter(s=>s.type==='Grind').sort((a,b)=>{
                      const d=(b.date||'').localeCompare(a.date||''); if(d!==0)return d;
                      return (parseInt(b.code.replace(/[GT]/,''),10)||0)-(parseInt(a.code.replace(/[GT]/,''),10)||0);
                    }).map(s=>{
                      const sessProfit = Math.round(playedTournaments.filter(t=>t.session===s.code).reduce((a,t)=>a+t.profit,0)*100)/100;
                      const hasTourns  = playedTournaments.some(t=>t.session===s.code);
                      return (
                      <tr key={s.id} className={`border-t border-gray-700 ${editId===s.id ? 'bg-gray-800' : 'hover:bg-gray-800/50'}`}>
                        <td className="px-3 py-2 font-mono text-green-400 font-semibold">{s.code}</td>
                        <td className="px-3 py-2 text-gray-300">
                          {editId===s.id
                            ? <input type="date" value={editForm.date||s.date} onChange={e => setEditForm(f=>({...f,date:e.target.value}))}
                                className="bg-gray-700 border border-green-500 rounded px-1 py-0.5 text-white text-xs focus:outline-none" />
                            : s.date}
                        </td>
                        <td className="px-3 py-2 text-gray-400">
                          {editId===s.id
                            ? <select value={editForm.typeSession||'Soir'} onChange={e => setEditForm(f=>({...f,typeSession:e.target.value}))}
                                className="bg-gray-700 border border-green-500 rounded px-1 py-0.5 text-white text-xs focus:outline-none">
                                {['Jour','Soir','Live'].map(o=><option key={o} value={o}>{o}</option>)}
                              </select>
                            : s.typeSession}
                        </td>
                        <td className="px-3 py-2">
                          {editId===s.id
                            ? <input type="time" value={editForm.start} onChange={e => setEditForm(f=>({...f,start:e.target.value}))}
                                className="bg-gray-700 border border-green-500 rounded px-1 py-0.5 text-white text-xs w-24 focus:outline-none" />
                            : <span className="text-gray-300">{s.start}</span>}
                        </td>
                        <td className="px-3 py-2">
                          {editId===s.id

                                className="bg-gray-700 border border-green-500 rounded px-1 py-0.5 text-white text-xs w-24 focus:outline-none" />

                              <button onClick={cancelEdit} className="text-gray-400 hover:text-gray-200 text-xs px-2 py-0.5 rounded hover:bg-gray-700 transition-colors">✕</button>
                            </div>
                          ) : (
                            <div className="flex gap-1">
                              <button onClick={() => startEdit(s)} className="text-blue-400 hover:text-blue-300 text-xs px-2 py-0.5 rounded hover:bg-blue-900/30 transition-colors">✎</button>
                              <button onClick={() => setConfirm(s)} className="text-red-400 hover:text-red-300 text-xs px-2 py-0.5 rounded hover:bg-red-900/30 transition-colors">✕</button>
                            </div>
                          )}
                        </td>
                        <td className="px-3 py-2 font-bold">
                          {hasTourns
                            ? <span className={sessProfit >= 0 ? 'text-green-400' : 'text-red-400'}>
                                {sessProfit >= 0 ? '+' : ''}{sessProfit.toFixed(2)}€
                              </span>
                            : <span className="text-gray-600">—</span>}
                        </td>
                      </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* ── Onglet Sessions Travail ── */}
          {sub === 'travail' && (
            <div className="space-y-3">
              <div className="flex justify-between items-center">
                <span className="text-gray-300 text-sm">
                  <span className="text-blue-400 font-semibold">{sessions.filter(s=>s.type==='Travail').length}</span> sessions Travail
                </span>
                {!showForm && (
                  <Btn onClick={() => { setForm({...emptyF, type:'Travail', date:toStr(new Date()), typeSession:'Jour'}); setShow(true); }} cls="bg-blue-600 hover:bg-blue-700 text-white">+ Nouvelle session</Btn>
                )}
              </div>

              {showForm && form.type === 'Travail' && (
                <div className="bg-gray-800 border border-gray-700 rounded-lg p-3">
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <div>
                      <label className="text-xs text-gray-400 block mb-1">Date</label>
                      <Inp type="date" value={form.date} onChange={set('date')} cls="w-full" />

                    <div>
                      <label className="text-xs text-gray-400 block mb-1">Début</label>
                      <Inp type="time" value={form.start} onChange={set('start')} cls="w-full" />
                    </div>
                    <div>
                      <label className="text-xs text-gray-400 block mb-1">Fin</label>
                      <Inp type="time" value={form.end} onChange={set('end')} cls="w-full" />

                      <label className="text-xs text-gray-400 block mb-1">Moment</label>
                      <Sel value={form.typeSession||'Jour'} onChange={set('typeSession')} options={['Jour','Soir']} cls="w-full" />

                  <div className="mt-2 text-xs text-gray-500">
                    Durée calculée : {calcDuration(form.start, form.end)}

                    <Btn onClick={save} cls="bg-blue-600 hover:bg-blue-700 text-white">Sauvegarder</Btn>
                    <Btn onClick={() => setShow(false)} cls="bg-gray-600 hover:bg-gray-700 text-white">Annuler</Btn>
                  </div>
                </div>

              <div className="overflow-x-auto rounded-lg border border-gray-700">
                <table className="w-full text-sm">
                  <thead className="bg-gray-800 text-gray-400 text-xs uppercase">
                    <tr>{['ID','Date','Début','Fin','Durée',''].map(h=>(
                      <th key={h} className="px-3 py-2 text-left">{h}</th>
                    ))}</tr>
                  </thead>
                  <tbody>
                    {[...sessions].filter(s=>s.type==='Travail').sort((a,b)=>{
                      const d=(b.date||'').localeCompare(a.date||''); if(d!==0)return d;
                      return (parseInt(b.code.replace(/[GT]/,''),10)||0)-(parseInt(a.code.replace(/[GT]/,''),10)||0);
                    }).map(s=>(
                      <tr key={s.id} className={`border-t border-gray-700 ${editId===s.id ? 'bg-gray-800' : 'hover:bg-gray-800/50'}`}>
                        <td className="px-3 py-2 font-mono text-blue-400 font-semibold">{s.code}</td>
                        <td className="px-3 py-2 text-gray-300">
                          {editId===s.id
                            ? <input type="date" value={editForm.date||s.date} onChange={e => setEditForm(f=>({...f,date:e.target.value}))}
                                className="bg-gray-700 border border-blue-500 rounded px-1 py-0.5 text-white text-xs focus:outline-none" />
                            : s.date}
                        </td>
                        <td className="px-3 py-2">
                          {editId===s.id
                            ? <input type="time" value={editForm.start} onChange={e => setEditForm(f=>({...f,start:e.target.value}))}
                                className="bg-gray-700 border border-blue-500 rounded px-1 py-0.5 text-white text-xs w-24 focus:outline-none" />
                            : <span className="text-gray-300">{s.start}</span>}
                        </td>
                        <td className="px-3 py-2">
                          {editId===s.id
                            ? <input type="time" value={editForm.end} onChange={e => setEditForm(f=>({...f,end:e.target.value}))}
                                className="bg-gray-700 border border-blue-500 rounded px-1 py-0.5 text-white text-xs w-24 focus:outline-none" />
                            : <span className="text-gray-300">{s.end}</span>}
                        </td>
                        <td className="px-3 py-2 text-gray-300 font-medium">
                          {editId===s.id ? calcDuration(editForm.start, editForm.end) : s.duration}
                        </td>
                        <td className="px-3 py-2">
                          {editId===s.id ? (
                            <div className="flex gap-1">
                              <button onClick={saveEdit} className="text-green-400 hover:text-green-300 text-xs px-2 py-0.5 rounded hover:bg-green-900/30 transition-colors">✓</button>
                              <button onClick={cancelEdit} className="text-gray-400 hover:text-gray-200 text-xs px-2 py-0.5 rounded hover:bg-gray-700 transition-colors">✕</button>
                            </div>
                          ) : (
                            <div className="flex gap-1">
                              <button onClick={() => startEdit(s)} className="text-blue-400 hover:text-blue-300 text-xs px-2 py-0.5 rounded hover:bg-blue-900/30 transition-colors">✎</button>
                              <button onClick={() => setConfirm(s)} className="text-red-400 hover:text-red-300 text-xs px-2 py-0.5 rounded hover:bg-red-900/30 transition-colors">✕</button>
                            </div>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {sub === 'tournois' && (
            <div className="space-y-3">
              <span className="text-gray-300 text-sm">{playedTournaments.length} tournois enregistrés</span>
              <div className="overflow-x-auto rounded-lg border border-gray-700">
                <table className="w-full text-sm" style={{ minWidth: '1100px' }}>
                  <thead className="bg-gray-800 text-gray-400 text-xs uppercase">
                    <tr>
                      {['Date','Session','Room','Tournoi','Buy-In','Entry','Re-Entry','Field','Format','Place','ITM','Gains','Entrées','Profit',''].map(h => (
                        <th key={h} className="px-3 py-2 text-left">{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {pageData.map((t, localIdx) => (
                      <tr key={pageStartIdx + localIdx} className={`border-t border-gray-700 hover:bg-gray-800/50
                        ${t.profit > 0 ? 'bg-green-950/40' : t.profit < 0 ? 'bg-red-950/30' : ''}`}>
                        <td className="px-3 py-2 text-gray-400 text-xs">{t.date}</td>
                        <td className="px-3 py-2 font-mono text-green-400">{t.session}</td>
                        <td className="px-3 py-2"><Badge cls={ROOM_CLS[t.room]}>{t.room}</Badge></td>
                        <td className="px-3 py-2 text-gray-200 text-xs max-w-[220px] truncate" title={t.notes || t.name || ''}>{t.name || '—'}{t.startTime ? <span className="text-gray-500"> · {t.startTime}</span> : null}</td>
                        <td className="px-3 py-2 text-gray-300">{t.buyIn}€</td>
                        <td className="px-3 py-2 text-center text-green-400">{t.entry ? '✓' : '—'}</td>
                        <td className="px-3 py-2 text-center">
                          {t.nbEntry > 1
                            ? <span className="text-orange-400 font-semibold">×{t.nbEntry - 1}</span>
                            : <span className="text-gray-600">—</span>}
                        </td>
                        <td className="px-3 py-2 text-gray-400 text-xs">{t.field}</td>
                        <td className="px-3 py-2"><Badge cls={FMT_CLS[t.format]}>{t.format}</Badge></td>
                        <td className="px-3 py-2 text-gray-400 text-xs">{t.place ? `${t.place}${t.players ? ' / ' + (t.playersEst ? '~' : '') + t.players : ''}` : (t.players ? `— / ${t.playersEst ? '~' : ''}${t.players}` : '—')}</td>
                        <td className="px-3 py-2 text-center">{t.itm ? <span className="text-green-400 font-bold">✓</span> : <span className="text-gray-600">—</span>}</td>
                        <td className="px-3 py-2">
                          {editTournId === t.id ? (
                            <div className="flex flex-col gap-1">
                              <div className="flex items-center gap-1">
                                <span className="text-xs text-gray-500 w-12">Gains</span>
                                <input type="number" min="0" step="0.01" value={editGains}
                                  onChange={e => setEditGains(e.target.value)}
                                  className="w-20 bg-gray-700 border border-green-500 rounded px-1 py-0.5 text-sm text-white focus:outline-none"
                                  autoFocus />

                                <span className="text-xs text-gray-500 w-12">Session</span>

                                  onChange={e => setEditSess(e.target.value.toUpperCase())}

                              </div>
                              <div className="flex gap-1">
                                <button onClick={() => {
                                  const g = Math.max(0, Number(editGains));
                                  const p = Math.round((g - t.buyIn * t.nbEntry) * 100) / 100;
                                  const sessDate = sessions.find(s => s.code === editSess)?.date;
                                  setPlayed(prev => prev.map(x => x.id === t.id ? { ...x, gains: g, profit: p, itm: g > 0, session: editSess || x.session, ...(sessDate ? { date: sessDate } : {}) } : x));
                                  setEditTournId(null);
                                }} className="text-green-400 hover:text-green-300 text-xs font-bold">✓ OK</button>
                                <button onClick={() => setEditTournId(null)} className="text-gray-500 hover:text-gray-300 text-xs">✕</button>
                              </div>
                            </div>
                          ) : (
                            <span className="text-gray-300">{t.gains > 0 ? `${t.gains}€` : '—'}</span>
                          )}
                        </td>
                        <td className="px-3 py-2 text-gray-400">{t.nbEntry}</td>
                        <td className={`px-3 py-2 font-bold ${t.profit > 0 ? 'text-green-400' : t.profit < 0 ? 'text-red-400' : 'text-gray-400'}`}>
                          {t.profit > 0 ? '+' : ''}{t.profit.toFixed(2)}€
                        </td>
                        <td className="px-3 py-2 flex items-center gap-2">
                          <button onClick={() => { setEditTournId(t.id); setEditGains(String(t.gains)); setEditSess(t.session); }}
                            className="text-gray-500 hover:text-blue-400 transition-colors" title="Modifier les gains">✏</button>
                          <button onClick={() => { if(confirm(`Supprimer ce tournoi (${t.room} ${t.buyIn}€) ?`)) setPlayed(p => p.filter(x => x.id !== t.id)); }}
                            className="text-gray-500 hover:text-red-400 transition-colors" title="Supprimer">🗑</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              {totalPages > 1 && (
                <div className="flex gap-2 items-center justify-center">
                  <Btn onClick={() => { setPage(p => Math.max(1,p-1)); setEditTournId(null); }} cls="bg-gray-700 hover:bg-gray-600 text-white" disabled={page===1}>←</Btn>
                  <span className="text-xs text-gray-400">{page} / {totalPages}</span>
                  <Btn onClick={() => { setPage(p => Math.min(totalPages,p+1)); setEditTournId(null); }} cls="bg-gray-700 hover:bg-gray-600 text-white" disabled={page===totalPages}>→</Btn>
                </div>
              )}
            </div>
          )}
        </div>

        {/* Modale confirmation suppression session */}
        {confirmDel && (
          <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50">
            <div className="bg-gray-800 border border-gray-600 rounded-xl p-6 w-80 shadow-xl space-y-4">
              <p className="text-white font-semibold text-base">Supprimer la session ?</p>
              <p className="text-gray-300 text-sm">
                Êtes-vous sûr de vouloir supprimer la session{' '}
                <span className="text-green-400 font-mono font-bold">{confirmDel.code}</span>{' '}
                du <span className="text-gray-100">{confirmDel.date}</span> ?
                <br/><span className="text-red-400">Les tournois associés seront aussi supprimés.</span>
              </p>
              <div className="flex gap-3 justify-end">
                <Btn onClick={() => setConfirm(null)} cls="bg-gray-600 hover:bg-gray-500 text-white">Annuler</Btn>
                <Btn onClick={() => {
                  setSessions(p => p.filter(x => x.id !== confirmDel.id));
                  setPlayed(p => p.filter(x => x.session !== confirmDel.code));
                  setConfirm(null);
                }} cls="bg-red-600 hover:bg-red-500 text-white font-semibold">Supprimer</Btn>
              </div>
            </div>
          </div>
        )}
        </>
      );
    }

    // ─── TAB 4 — DASHBOARD ────────────────────────────────────────
    // ─── TAB 5 — RECORDS ──────────────────────────────────────────
    function RecordsTab({ sessions, playedTournaments }) {
      const [period, setPeriod]     = useState('all');
      const [dateFrom, setDateFrom] = useState('');
      const [dateTo, setDateTo]     = useState('');
      const [scoreBy, setScoreBy]   = useState('gains');   // classement des scores : gains bruts ou profit
      const isCustom = period === 'custom';

      const cutoff = useMemo(() => {
        if (isCustom || period === 'all') return null;
        if (period === 'year') return `${new Date().getFullYear()}-01-01`;
        const d = new Date(); d.setDate(d.getDate() - Number(period)); return toStr(d);
      }, [period, isCustom]);
      const inRange = d => isCustom ? (!dateFrom || d >= dateFrom) && (!dateTo || d <= dateTo) : (!cutoff || d >= cutoff);

      const T = useMemo(() => playedTournaments.filter(t => inRange(t.date))
        .sort((a, b) => (a.date + (a.startTime || '')).localeCompare(b.date + (b.startTime || ''))),
        [playedTournaments, cutoff, isCustom, dateFrom, dateTo]);
      const S = useMemo(() => sessions.filter(s => s.type === 'Grind' && inRange(s.date)), [sessions, cutoff, isCustom, dateFrom, dateTo]);

      // ── formats d'affichage
      const eur = (v, sign = false, round = false) => {
        const a = Math.abs(v); const s = a >= 1000 || (round && a >= 100) ? Math.round(a).toLocaleString('fr-FR') : a.toLocaleString('fr-FR', { minimumFractionDigits: a % 1 ? 2 : 0, maximumFractionDigits: 2 });
        return `${v < 0 ? '−' : sign && v > 0 ? '+' : ''}${s} €`;
      };
      const dShort = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
      const mins = (a, b) => { if (!a || !b) return null; const [h1, m1] = a.split(':').map(Number), [h2, m2] = b.split(':').map(Number); let d = (h2 * 60 + m2) - (h1 * 60 + m1); if (d < 0) d += 1440; return d; };
      const hm = m => `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}`;
      const durH = s => { const p = (s.duration || '0h00').replace('h', ':').split(':'); return Number(p[0]) + (Number(p[1]) || 0) / 60; };
      const ord = p => p === 1 ? '1er' : `${p}e`;

      const R = useMemo(() => {
        if (!T.length) return null;
        const cost = t => t.buyIn * t.nbEntry;
        const max = (arr, f) => arr.reduce((a, b) => (a == null || f(b) > f(a) ? b : a), null);
        const min = (arr, f) => arr.reduce((a, b) => (a == null || f(b) < f(a) ? b : a), null);

        // Tournois
        const paid = T.filter(t => t.buyIn > 0);
        const scores = [...T].filter(t => (scoreBy === 'gains' ? t.gains : t.profit) > 0)
          .sort((a, b) => (scoreBy === 'gains' ? b.gains - a.gains : b.profit - a.profit)).slice(0, 10);
        const mult = max(paid.filter(t => t.gains > 0), t => t.gains / cost(t));
        const rel = min(T.filter(t => t.place && t.players >= 50), t => t.place / t.players);
        const bounty = max(T.filter(t => t.bounty > 0), t => t.bounty);
        const timed = T.map(t => ({ t, m: mins(t.startTime, t.endTime) })).filter(x => x.m != null && x.m < 900);
        const longest = max(timed, x => x.m);
        const mostHands = max(T.filter(t => t.hands), t => t.hands);
        const bigField = max(T.filter(t => t.players && t.itm), t => t.players);

        const wins = T.filter(t => t.place === 1), podiums = T.filter(t => t.place && t.place <= 3), top9 = T.filter(t => t.place && t.place <= 9);
        const totals = {
          n: T.length, entries: T.reduce((a, t) => a + t.nbEntry, 0), itm: T.filter(t => t.itm).length,
          hands: T.reduce((a, t) => a + (t.hands || 0), 0), bounty: T.reduce((a, t) => a + (t.bounty || 0), 0),
          profit: T.reduce((a, t) => a + t.profit, 0), inv: T.reduce((a, t) => a + cost(t), 0),
        };

        // Courbe cumulée : sommet, plus gros downswing, temps depuis le sommet
        let cum = 0, peak = 0, peakAt = 0, ddMax = 0, ddFrom = 0, ddTo = 0;
        const curve = [{ i: 0, cum: 0, date: T[0].date }];
        T.forEach((t, k) => {
          cum += t.profit; const i = k + 1;
          curve.push({ i, cum: Math.round(cum * 100) / 100, date: t.date, name: t.name });
          if (cum > peak) { peak = cum; peakAt = i; }
          if (peak - cum > ddMax) { ddMax = peak - cum; ddFrom = peakAt; ddTo = i; }
        });
        const last = curve[curve.length - 1];
        const fromPeak = peak - last.cum;
        const daysSincePeak = Math.round((new Date(last.date) - new Date(curve[peakAt].date)) / 864e5);

        // Sessions
        const byCode = {};
        T.forEach(t => { (byCode[t.session] = byCode[t.session] || []).push(t); });
        const sess = S.map(s => {
          const ts = byCode[s.code] || [];
          const bbH = ts.reduce((a, t) => a + (t.bbHands || 0), 0);
          return { ...s, ts, n: ts.length, profit: ts.reduce((a, t) => a + t.profit, 0), inv: ts.reduce((a, t) => a + cost(t), 0),
            hands: ts.reduce((a, t) => a + (t.hands || 0), 0), h: durH(s), bbH,
            ev: bbH ? 100 * ts.reduce((a, t) => a + (t.bbEV || 0), 0) / bbH : null,
            luck: ts.reduce((a, t) => a + (t.bbWon || 0) - (t.bbEV || 0), 0) };
        }).filter(s => s.n > 0).sort((a, b) => a.date.localeCompare(b.date));
        const sBest = max(sess, s => s.profit), sWorst = min(sess, s => s.profit), sLong = max(sess, s => s.h);
        const sMostT = max(sess, s => s.n), sMostH = max(sess.filter(s => s.hands), s => s.hands);
        const sEV = max(sess.filter(s => s.bbH >= 1000), s => s.ev);
        const sSun = max(sess.filter(s => s.bbH), s => s.luck), sBad = min(sess.filter(s => s.bbH), s => s.luck);

        // Séries de sessions
        let cw = 0, cl = 0, bw = 0, bl = 0, w = 0, l = 0, gRun = 0, gBest = 0, lRun = 0, lBest = 0;
        sess.forEach(s => {
          if (s.profit > 0) { w++; l = 0; bw = Math.max(bw, w); gRun += s.profit; lRun = 0; gBest = Math.max(gBest, gRun); }
          else { l++; w = 0; bl = Math.max(bl, l); lRun += s.profit; gRun = 0; lBest = Math.min(lBest, lRun); }
        });
        for (let i = sess.length - 1; i >= 0 && sess[i].profit > 0; i--) cw++;
        for (let i = sess.length - 1; i >= 0 && sess[i].profit <= 0; i--) cl++;

        // Mois
        const mo = {};
        T.forEach(t => { const k = t.date.slice(0, 7); mo[k] = (mo[k] || 0) + t.profit; });
        const months = Object.entries(mo).map(([k, v]) => ({ k, v }));
        const mBest = max(months, m => m.v), mWorst = min(months, m => m.v);

        // Jours (calendrier)
        const days = {};
        T.forEach(t => { const d = days[t.date] || (days[t.date] = { p: 0, n: 0 }); d.p += t.profit; d.n += 1; });

        return { scores, mult, rel, bounty, longest, mostHands, bigField, wins, podiums, top9, totals,
          curve, peak, peakAt, ddMax, ddFrom, ddTo, fromPeak, daysSincePeak, sess, sBest, sWorst, sLong, sMostT, sMostH, sEV, sSun, sBad,
          cw, cl, bw, bl, gBest, lBest, mBest, mWorst, days, nMonths: months.length };
      }, [T, S, scoreBy]);

      // ── petits composants
      const Room = ({ r }) => <span className="inline-flex items-center gap-1.5 text-xs text-gray-400"><span className="w-1.5 h-1.5 rounded-full" style={{ background: ROOM_CHART[r] || '#6b7280' }} />{r}</span>;
      const Eyebrow = ({ children, cls = 'text-gray-500' }) => <p className={`text-[10.5px] font-semibold uppercase tracking-[0.14em] ${cls}`}>{children}</p>;
      const Section = ({ title, hint, right, children }) => (
        <section className="space-y-3">
          <div className="flex items-end gap-3">
            <h3 className="text-[15px] font-semibold text-gray-100">{title}</h3>
            {hint && <p className="text-xs text-gray-500 pb-px">{hint}</p>}
            <div className="flex-1 h-px bg-gray-800 mb-1.5" />
            {right}
          </div>
          {children}
        </section>
      );
      const Tile = ({ label, value, color = 'text-white', sub, foot, accent = 'from-gray-800/80' }) => (
        <div className={`rounded-xl border border-gray-800 bg-gradient-to-b ${accent} to-gray-900/60 p-4 flex flex-col gap-1.5 min-w-0`}>
          <Eyebrow>{label}</Eyebrow>
          <p className={`text-[22px] leading-tight font-bold tabular-nums ${color}`}>{value}</p>
          {sub && <p className="text-xs text-gray-300 truncate" title={typeof sub === 'string' ? sub : undefined}>{sub}</p>}
          {foot && <div className="text-[11px] text-gray-500 truncate">{foot}</div>}
        </div>
      );
      const Stat = ({ label, value, color = 'text-white' }) => (
        <div className="px-4 py-3 min-w-0">
          <p className={`text-xl font-bold tabular-nums ${color}`}>{value}</p>
          <p className="text-[11px] text-gray-500 mt-0.5">{label}</p>
        </div>
      );

      const header = (
        <div className="flex flex-wrap gap-3 items-end">
          <div className="mr-auto">
            <Eyebrow cls="text-yellow-500/80">Hall of fame</Eyebrow>
            <h2 className="text-2xl font-bold text-white tracking-tight">Records</h2>
          </div>
          <div className="flex gap-1 bg-gray-900 border border-gray-800 rounded-lg p-1">
            {[['30', '30 j'], ['90', '3 mois'], ['year', 'Cette année'], ['all', 'Tout'], ['custom', 'Plage']].map(([v, l]) => (
              <button key={v} onClick={() => setPeriod(v)}
                className={`px-3 py-1.5 rounded-md text-xs font-medium transition-colors ${period === v ? 'bg-yellow-500 text-gray-900' : 'text-gray-400 hover:text-white'}`}>{l}</button>
            ))}
          </div>
          {isCustom && (<div className="flex gap-2">
            <input type="date" value={dateFrom} onChange={e => setDateFrom(e.target.value)} className="bg-gray-900 border border-gray-700 rounded-md px-2 py-1.5 text-sm text-white focus:outline-none focus:border-yellow-500" />
            <input type="date" value={dateTo} onChange={e => setDateTo(e.target.value)} className="bg-gray-900 border border-gray-700 rounded-md px-2 py-1.5 text-sm text-white focus:outline-none focus:border-yellow-500" />
          </div>)}
        </div>
      );

      if (!R) return (
        <div className="p-4 space-y-6">{header}
          <div className="rounded-2xl border border-dashed border-gray-700 py-16 text-center text-gray-500">Aucun tournoi sur cette période : élargis la plage pour voir tes records.</div>
        </div>
      );

      const top = R.scores[0];
      const val = t => scoreBy === 'gains' ? t.gains : t.profit;
      const MEDAL = [
        { c: 'text-yellow-300', ring: 'ring-yellow-400/50', bg: 'from-yellow-500/15', h: 'pt-7', n: '1' },
        { c: 'text-slate-200', ring: 'ring-slate-300/40', bg: 'from-slate-300/10', h: 'pt-4', n: '2' },
        { c: 'text-amber-500', ring: 'ring-amber-600/40', bg: 'from-amber-700/15', h: 'pt-4', n: '3' },
      ];

      // Calendrier : 53 dernières semaines jusqu'au dernier jour joué de la période
      const endD = new Date((T[T.length - 1].date) + 'T12:00:00');
      const startD = new Date(endD); startD.setDate(startD.getDate() - 364 - ((startD.getDay() + 6) % 7));
      const weeks = []; let cur = new Date(startD);
      while (cur <= endD) { const wk = []; for (let i = 0; i < 7; i++) { wk.push(toStr(cur)); cur.setDate(cur.getDate() + 1); } weeks.push(wk); }
      const dayVals = Object.values(R.days).map(d => Math.abs(d.p)).sort((a, b) => a - b);
      const ref = dayVals[Math.floor(dayVals.length * 0.9)] || 1;
      const cellColor = d => {
        const v = R.days[d]; if (!v) return 'rgba(55,65,81,0.35)';
        const k = Math.min(1, Math.abs(v.p) / ref), a = 0.25 + 0.75 * k;
        return v.p >= 0 ? `rgba(34,197,94,${a})` : `rgba(239,68,68,${a})`;
      };
      const monthLabels = weeks.map((wk, i) => { const d = new Date(wk[0] + 'T12:00:00'); return (i === 0 || d.getDate() <= 7) ? d.toLocaleDateString('fr-FR', { month: 'short' }) : ''; });

      return (
        <div className="p-4 space-y-8">
          {header}

          {/* ── Record absolu + bankroll */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
            {top && (
              <div className="lg:col-span-2 relative overflow-hidden rounded-2xl border border-yellow-500/30 bg-gradient-to-br from-yellow-500/[0.12] via-gray-900 to-gray-900 p-6">
                <div className="absolute -right-10 -top-16 w-64 h-64 rounded-full bg-yellow-400/10 blur-3xl pointer-events-none" />
                <Eyebrow cls="text-yellow-400/90">Record absolu · {scoreBy === 'gains' ? 'plus gros gain' : 'plus gros profit'}</Eyebrow>
                <div className="mt-3 flex flex-wrap items-end gap-x-6 gap-y-2">
                  <p className="text-5xl md:text-6xl font-extrabold tracking-tight tabular-nums text-yellow-300">{eur(val(top))}</p>
                  {top.buyIn > 0 && top.gains > 0 && <p className="text-lg font-semibold text-yellow-100/80 pb-2 tabular-nums">× {Math.round(top.gains / (top.buyIn * top.nbEntry)).toLocaleString('fr-FR')} le buy-in</p>}
                </div>
                <p className="mt-3 text-lg text-white font-semibold truncate">{top.name}</p>
                <div className="mt-1 flex flex-wrap items-center gap-x-4 gap-y-1 text-sm text-gray-400">
