                      <td className={`px-3 py-2 text-xs ${c.roi >= 0 ? 'text-green-400' : 'text-red-400'}`}>{plPct(c.roi)}</td>
                      <td className={`px-3 py-2 font-bold ${c.adj >= 0 ? 'text-green-400' : 'text-red-400'}`}>{plPct(c.adj)}</td>
                      <td className="px-3 py-2 text-gray-400 text-xs">{(c.itm * 100).toFixed(0)} %</td>
                      <td className="px-3 py-2">{badge(c)}</td>
                    </tr>
                  ))}
                  {candidates.length === 0 && <tr><td colSpan={15} className="px-3 py-8 text-center text-gray-500">Aucun tournoi connu sur ce créneau et ce jour avec ces filtres.</td></tr>}
                </tbody>
              </table>
            </div>
            <div className="flex flex-wrap gap-2 items-center">
              <Btn onClick={savePlan} disabled={!plan.length} cls="bg-amber-600 hover:bg-amber-700 text-white">💾 Enregistrer cette session prévue</Btn>
              {picked && <Btn onClick={() => setPicked(null)} cls="bg-gray-700 hover:bg-gray-600 text-gray-200">↺ Revenir à la proposition</Btn>}
              <p className="text-[11px] text-gray-500">Clique sur une ligne pour l'ajouter ou la retirer. Les événements de séries (W Series, Million Week, Day 2…) sont exclus des propositions. ROI ajusté : ton ROI sur ce tournoi, ramené vers ta moyenne quand il a été peu joué, avec chaque score plafonné à {PL_CAP} buy-ins, pour ne pas surestimer un coup de chance. Late reg : jusqu'à la fin du niveau 1 pour les Trident, du niveau 3 pour les KO, SKO et Mystery, du niveau 6 pour les Vanilla, calculé avec la durée des niveaux lue dans tes historiques, niveau 1 compté à part car il est souvent plus long (« 40+8 min » = niveau 1 de 40 min puis 8 min par niveau) (sinon estimé d'après tes inscriptions tardives). Si une table manque au début, la proposition peut décaler ton inscription dans la late reg.</p>
            </div>
          </>)}


          {view === 'live' && (() => {
            const nowM = svMin(liveNow);
            const pool = candidates.filter(c => prio[c.key] && !liveDone.has(c.key));
            const order = (a, b) => (prio[a.key].kind === prio[b.key].kind ? prio[a.key].n - prio[b.key].n : prio[a.key].kind === 'S' ? -1 : 1);
            const open = pool.filter(c => c.start - 5 <= nowM && nowM <= regEnd(c)).sort(order);
            const soon = pool.filter(c => c.start > nowM && c.start <= nowM + 60).sort((a, b) => a.start - b.start);
            const free = Math.max(0, maxTables - liveTables);
            const Row = ({ c, go }) => (
              <div className={`flex flex-wrap items-center gap-2 px-3 py-2 rounded border ${go ? 'border-green-600 bg-green-950/40' : 'border-gray-700 bg-gray-800'}`}>
                {prioBadge(c)}
                <span className="font-mono text-gray-300 text-sm">{svFmt(c.start)}</span>
                <Badge cls={ROOM_CLS[c.room]}>{c.room}</Badge>
                <span className="text-gray-100 font-medium">{c.name}</span>
                <span className="text-gray-400 text-sm">{c.buyIn}€</span>
                <span className={`text-xs font-bold ${c.adj >= 0 ? 'text-green-400' : 'text-red-400'}`}>{plPct(c.adj)}</span>
                <span className="text-xs text-gray-500">inscriptions jusqu'à ~{svFmt(regEnd(c))}{c.late == null ? ' (estimation)' : ''}</span>
                <button onClick={() => { const s = new Set(liveDone); s.add(c.key); setLiveDone(s); setLiveTables(n => n + 1); }}
                  className="ml-auto px-2 py-1 rounded bg-green-700 hover:bg-green-600 text-white text-xs">Je m'inscris</button>
                <button onClick={() => { const s = new Set(liveDone); s.add(c.key); setLiveDone(s); }}
                  className="px-2 py-1 rounded bg-gray-700 hover:bg-gray-600 text-gray-300 text-xs">Passer</button>
              </div>
            );
            return (
              <div className="space-y-4">
                <div className="bg-gray-800 border border-gray-700 rounded-lg p-3 flex flex-wrap gap-4 items-end">
                  <div><p className="text-xs text-gray-500 mb-1">Heure</p>
                    <div className="flex gap-1"><input type="time" value={liveNow} onChange={e => setLiveNow(e.target.value)} className="bg-gray-700 border border-gray-600 rounded px-2 py-1 text-sm text-white" />
                    <button onClick={() => setLiveNow(nowStr())} className="px-2 py-1 rounded bg-gray-700 text-xs text-gray-300">maintenant</button></div></div>
                  <div><p className="text-xs text-gray-500 mb-1">Tables en cours</p>
                    <div className="flex items-center gap-1">
                      <button onClick={() => setLiveTables(n => Math.max(0, n - 1))} className="px-3 py-1 rounded bg-red-800 hover:bg-red-700 text-white text-sm">Bust −1</button>
                      <span className="w-10 text-center text-xl font-bold text-white">{liveTables}</span>
                      <button onClick={() => setLiveTables(n => n + 1)} className="px-3 py-1 rounded bg-gray-700 text-white text-sm">+1</button>
                      <span className="text-xs text-gray-500 ml-1">/ {maxTables} max</span>
                    </div></div>
                  <div className="text-sm"><p className="text-xs text-gray-500 mb-1">Places libres</p><p className={`text-xl font-bold ${free > 0 ? 'text-green-400' : 'text-gray-500'}`}>{free}</p></div>
                  <p className="text-xs text-gray-500 max-w-sm">Basé sur la session préparée ({date}, {from} → {to}) : socle d'abord, puis remplaçants par ordre de priorité.</p>
                </div>
                <div>
                  <p className="text-sm font-semibold text-gray-200 mb-2">{free > 0 ? `À lancer maintenant (${Math.min(free, open.length)})` : 'Tu es au maximum de tables : attends un bust'}</p>
                  <div className="space-y-1.5">
                    {open.length === 0 && <p className="text-sm text-gray-500">Aucun tournoi prévu n'est ouvert aux inscriptions en ce moment.</p>}
                    {open.map((c, i) => <Row key={c.key} c={c} go={i < free} />)}
                  </div>
                </div>
                <div>
                  <p className="text-sm font-semibold text-gray-200 mb-2">Dans l'heure qui vient</p>
                  <div className="space-y-1.5">
                    {soon.length === 0 && <p className="text-sm text-gray-500">Rien de prévu dans l'heure.</p>}
                    {soon.map(c => <Row key={c.key} c={c} go={false} />)}
                  </div>
                </div>
                {liveDone.size > 0 && <button onClick={() => { setLiveDone(new Set()); setLiveTables(0); }} className="text-xs text-gray-500 underline">Réinitialiser la session en cours</button>}
              </div>
            );
          })()}
          {view === 'saved' && (
            <div className="space-y-3">
              {(plans || []).length === 0 && <p className="text-sm text-gray-500">Aucune session prévue enregistrée.</p>}
              {[...(plans || [])].reverse().map(p => {
                const real = playedTournaments.filter(t => t.date === p.date);
                const rInv = real.reduce((a, t) => a + t.buyIn * t.nbEntry, 0), rProf = real.reduce((a, t) => a + t.profit, 0);
                const doneKeys = new Set(real.map(t => `${t.room}|${plNorm(t.name)}|${t.buyIn}`));
                return (
                  <div key={p.id} className="bg-gray-800 border border-gray-700 rounded-lg p-3">
                    <div className="flex flex-wrap items-center gap-3">
                      <p className="font-bold text-white capitalize">{new Date(p.date + 'T12:00:00').toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' })}</p>
                      <p className="text-xs text-gray-400">{p.from} → {p.to} · {p.items.length} tournois · budget {svEur(p.budget)} · espérance {svEur(p.ev, true)}</p>
                      {real.length > 0 && <p className={`text-xs font-semibold ${rProf >= 0 ? 'text-green-400' : 'text-red-400'}`}>Réel : {real.length} tournois, {svEur(rInv)} investis, {svEur(rProf, true)}</p>}
                      <div className="ml-auto flex gap-2">
                        <Btn onClick={() => loadPlan(p)} cls="bg-gray-700 hover:bg-gray-600 text-gray-200">Ouvrir</Btn>
                        <Btn onClick={() => setPlans(prev => prev.filter(x => x.id !== p.id))} cls="bg-gray-700 hover:bg-red-700 text-gray-200">Supprimer</Btn>
                      </div>
                    </div>
                    <div className="flex flex-wrap gap-1.5 mt-2">
                      {p.items.map(i => (
                        <span key={i.key} className={`text-[11px] px-2 py-0.5 rounded border ${doneKeys.has(i.key) ? 'border-green-600 text-green-300' : 'border-gray-600 text-gray-300'}`}>
                          {i.time} · {i.name} {i.buyIn}€ <span className="text-gray-500">({i.room})</span>
                        </span>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {view === 'cat' && <CatalogueView cat={cat} badge={badge} />}
        </div>
      );
    }

    // ─── TAB ANALYSE STATISTIQUE ──────────────────────────────────
    // ROI = profit total / investi total d'un segment. Intervalles de confiance et
    // tests par bootstrap (rééchantillonnage des tournois), adaptés aux résultats MTT
    // très asymétriques. Correction de Holm pour les comparaisons multiples.
    const AN_B = 1000;          // nombre de rééchantillonnages
    const AN_MIN_N = 100;       // en dessous : échantillon trop petit (les gros scores rares faussent le bootstrap)
    function anRng(seed) {      // générateur pseudo-aléatoire reproductible (mulberry32)
      let a = seed >>> 0;
      return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    }
    function anBootRoi(items, rnd) {   // items: [{inv, prof}] -> distribution du ROI
      const n = items.length, out = new Float64Array(AN_B);
      for (let b = 0; b < AN_B; b++) {
        let si = 0, sp = 0;
        for (let i = 0; i < n; i++) { const it = items[(rnd() * n) | 0]; si += it.inv; sp += it.prof; }
        out[b] = si > 0 ? sp / si : 0;
      }
      return out;
    }
    const anQuant = (arr, q) => { const s = Array.from(arr).sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.max(0, Math.floor(q * (s.length - 1))))]; };
    function anWilson(k, n) {
      if (!n) return [0, 0];
      const z = 1.96, p = k / n, d = 1 + z * z / n, c = p + z * z / (2 * n), m = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n));
      return [(c - m) / d, (c + m) / d];
    }
    function anPropP(k1, n1, k2, n2) {  // test z de deux proportions, p bilatéral
      if (!n1 || !n2) return 1;
      const p = (k1 + k2) / (n1 + n2), se = Math.sqrt(p * (1 - p) * (1 / n1 + 1 / n2));
      if (!se) return 1;
      const z = Math.abs(k1 / n1 - k2 / n2) / se;
      const t = 1 / (1 + 0.2316419 * z), dd = 0.3989423 * Math.exp(-z * z / 2);
      const tail = dd * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
      return Math.min(1, 2 * tail);
    }
    function anHolm(ps) {               // p-values ajustées (Holm-Bonferroni)
      const idx = ps.map((p, i) => [p, i]).filter(x => x[0] != null).sort((a, b) => a[0] - b[0]);
      const out = ps.map(() => null); let run = 0;
      idx.forEach(([p, i], r) => { run = Math.max(run, Math.min(1, p * (idx.length - r))); out[i] = run; });
      return out;
    }

    const AN_PARAMS = [
      { id:'room',    label:'Room',              key: t => t.room },
      { id:'buyin',   label:'Buy-in',            key: t => t.buyIn <= 3 ? '≤ 3 €' : t.buyIn <= 6 ? '5 €' : t.buyIn <= 12 ? '10 €' : '20 € et +', order:['≤ 3 €','5 €','10 €','20 € et +'] },
      { id:'field',   label:'Field',             key: t => t.field || 'inconnu', order:['0-149','150-499','500-999','1000-2000','2000+','inconnu'] },
      { id:'format',  label:'Format',            key: t => t.format || '?' },
      { id:'roomfield', label:'Room × Field',    key: t => `${t.room} · ${t.field || '?'}` },
      { id:'roombuyin', label:'Room × Buy-in',   key: t => `${t.room} · ${t.buyIn <= 6 ? '≤ 5 €' : t.buyIn <= 12 ? '10 €' : '20 € +'}` },
      { id:'moment',  label:'Moment (Jour / Soir)', key: t => { const h = parseInt((t.startTime || '').slice(0, 2), 10); return isNaN(h) ? '?' : (h >= 17 || h < 6) ? 'Soir' : 'Jour'; } },
      { id:'heure',   label:'Heure de début',    key: t => { const h = parseInt((t.startTime || '').slice(0, 2), 10); if (isNaN(h)) return '?'; return h < 12 ? 'Matin (< 12h)' : h < 17 ? 'Après-midi (12-17h)' : h < 21 ? 'Soirée (17-21h)' : 'Nuit (≥ 21h)'; }, order:['Matin (< 12h)','Après-midi (12-17h)','Soirée (17-21h)','Nuit (≥ 21h)'] },
      { id:'jour',    label:'Jour de la semaine', key: t => ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'][new Date(t.date + 'T12:00:00').getDay()], order:['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'] },
      { id:'mois',    label:'Mois',              key: t => (t.date || '').slice(0, 7) },
    ];

    function anAnalyse(tourns, param, seed) {
      const rnd = anRng(seed);
      const items = tourns.map(t => ({ t, inv: t.buyIn * t.nbEntry, prof: t.profit, itm: !!t.itm, g: param.key(t) }));
      const groups = {};
      items.forEach(it => { (groups[it.g] = groups[it.g] || []).push(it); });
      let keys = Object.keys(groups);
      if (param.order) keys.sort((a, b) => (param.order.indexOf(a) + 1 || 99) - (param.order.indexOf(b) + 1 || 99));
      else keys.sort((a, b) => groups[b].length - groups[a].length);
      const rows = keys.map(k => {
        const g = groups[k], rest = items.filter(it => it.g !== k);
        const inv = g.reduce((a, x) => a + x.inv, 0), prof = g.reduce((a, x) => a + x.prof, 0);
        const rInv = rest.reduce((a, x) => a + x.inv, 0), rProf = rest.reduce((a, x) => a + x.prof, 0);
        const roi = inv > 0 ? prof / inv : 0, rRoi = rInv > 0 ? rProf / rInv : 0;
        const kItm = g.filter(x => x.itm).length, kRest = rest.filter(x => x.itm).length;
        const row = { key: k, n: g.length, inv, prof, roi, restRoi: rRoi, itm: kItm / g.length, itmCi: anWilson(kItm, g.length),
                      itmP: anPropP(kItm, g.length, kRest, rest.length), small: g.length < AN_MIN_N || rest.length < AN_MIN_N };
        if (!row.small) {
          const bs = anBootRoi(g, rnd), br = anBootRoi(rest, rnd);
          row.ci = [anQuant(bs, 0.025), anQuant(bs, 0.975)];
          let le = 0, ge = 0; for (let b = 0; b < AN_B; b++) { const d = bs[b] - br[b]; if (d <= 0) le++; if (d >= 0) ge++; }
          row.p = Math.min(1, 2 * Math.min(le, ge) / AN_B);
        }
        return row;
      });
      const adj = anHolm(rows.map(r => r.small ? null : r.p));
      const adjI = anHolm(rows.map(r => r.small ? null : r.itmP));
      rows.forEach((r, i) => { r.pAdj = adj[i]; r.itmPAdj = adjI[i]; });
      return rows;
    }

    // Re-entries : on découpe chaque tournoi en bullets. Seule la dernière bullet peut cash (les précédentes ont busté) ;
    // les bounties, dont on ne sait pas quelle bullet les a gagnés, sont répartis à parts égales.
    function anBullets(tourns) {
      const first = [], re = [];
      tourns.filter(t => !/add-on/.test(t.notes || '')).forEach(t => {
        const k = Math.max(1, t.nbEntry | 0);
        for (let j = 1; j <= k; j++) {
          const gain = (t.bounty || 0) / k + (j === k ? (t.prize || 0) : 0);
          (j === 1 ? first : re).push({ inv: t.buyIn, prof: gain - t.buyIn, itm: j === k && !!t.itm, room: t.room, format: t.format });
        }
      });
      return { first, re };
    }
    function anCompare(a, b, seed) {
      const rnd = anRng(seed);
      const sum = x => { const inv = x.reduce((s, i) => s + i.inv, 0); return inv ? x.reduce((s, i) => s + i.prof, 0) / inv : 0; };
      const out = { roiA: sum(a), roiB: sum(b), nA: a.length, nB: b.length,
        itmA: a.length ? a.filter(x => x.itm).length / a.length : 0, itmB: b.length ? b.filter(x => x.itm).length / b.length : 0 };
      if (a.length >= AN_MIN_N && b.length >= AN_MIN_N) {
        const ba = anBootRoi(a, rnd), bb = anBootRoi(b, rnd);
        out.ciA = [anQuant(ba, 0.025), anQuant(ba, 0.975)]; out.ciB = [anQuant(bb, 0.025), anQuant(bb, 0.975)];
        let le = 0, ge = 0; for (let i = 0; i < AN_B; i++) { const d = ba[i] - bb[i]; if (d <= 0) le++; if (d >= 0) ge++; }
        out.p = Math.min(1, 2 * Math.min(le, ge) / AN_B);
        out.pZero = Math.min(1, 2 * Math.min(Array.from(bb).filter(v => v <= 0).length, Array.from(bb).filter(v => v >= 0).length) / AN_B);
      }
      return out;
    }

    function ReentryCard({ tourns }) {
      const data = useMemo(() => {
        const { first, re } = anBullets(tourns);
        const all = anCompare(first, re, 11);
        const by = (key) => [...new Set(first.map(x => x[key]))].map(v => ({ v, ...anCompare(first.filter(x => x[key] === v), re.filter(x => x[key] === v), 13) }))
          .filter(r => r.nB > 0).sort((a, b) => b.nB - a.nB);
        return { all, rooms: by('room'), formats: by('format'), nT: tourns.filter(t => !/add-on/.test(t.notes || '')).length, nRe: tourns.filter(t => t.nbEntry > 1 && !/add-on/.test(t.notes || '')).length };
      }, [tourns]);
      const pct = x => `${x > 0 ? '+' : ''}${(x * 100).toFixed(1)} %`;
      const { all } = data;
      let msg;
      if (all.p == null) msg = <>Pas encore assez de re-entries pour conclure (il en faut au moins {AN_MIN_N}).</>;
      else if (all.p < 0.05) msg = all.roiB < all.roiA ? <>Tes re-entries sont <b>significativement moins rentables</b> que tes 1res bullets.</> : <>Tes re-entries sont <b>significativement plus rentables</b> que tes 1res bullets.</>;
      else msg = <>La différence entre 1re bullet et re-entry n'est <b>pas significative</b> : avec ce volume, elle peut venir du hasard.</>;
      const zero = all.pZero == null ? null : all.pZero < 0.05 ? (all.roiB > 0 ? ' Tes re-entries sont significativement rentables (ROI > 0).' : ' Tes re-entries perdent significativement de l\'argent.') : ` On ne peut pas encore dire si tes re-entries gagnent ou perdent de l'argent (l'intervalle contient 0).`;
      const Table = ({ rows, label }) => (
        <table className="w-full text-xs">
          <thead className="text-gray-500"><tr><th className="text-left py-1">{label}</th><th className="text-right">1res bullets</th><th className="text-right">ROI</th><th className="text-right">Re-entries</th><th className="text-right">ROI</th></tr></thead>
          <tbody>{rows.map(r => (
            <tr key={r.v} className="border-t border-gray-700">
              <td className="py-1 text-gray-300">{r.v}</td>
              <td className="text-right text-gray-500">{r.nA}</td><td className={`text-right ${r.roiA >= 0 ? 'text-green-400' : 'text-red-400'}`}>{pct(r.roiA)}</td>
              <td className="text-right text-gray-500">{r.nB}</td><td className={`text-right ${r.roiB >= 0 ? 'text-green-400' : 'text-red-400'}`}>{pct(r.roiB)}{r.nB < AN_MIN_N && <span className="text-gray-600"> *</span>}</td>
            </tr>))}</tbody>
        </table>
      );
      return (
        <div className="bg-gray-800 border border-gray-700 rounded-lg p-4 space-y-3">
          <h3 className="font-semibold text-indigo-200">🔁 Re-entries : la 2e bullet est-elle rentable ?</h3>
          <p className="text-xs text-gray-400">{data.nRe} tournois avec re-entry sur {data.nT}. Chaque tournoi est découpé en bullets : seule la dernière peut cash, les bounties sont répartis à parts égales entre les bullets.</p>
          <div className="grid md:grid-cols-2 gap-3">
            {[['1re bullet', all.roiA, all.ciA, all.nA, all.itmA], ['Re-entries (2e bullet et +)', all.roiB, all.ciB, all.nB, all.itmB]].map(([l, roi, ci, n, itm]) => (
              <div key={l} className="bg-gray-900/50 rounded p-3">
                <p className="text-xs text-gray-500">{l} · {n} bullets</p>
                <p className={`text-2xl font-bold ${roi >= 0 ? 'text-green-400' : 'text-red-400'}`}>{pct(roi)}</p>
                <p className="text-[11px] text-gray-500">{ci ? `Intervalle à 95 % : ${pct(ci[0])} à ${pct(ci[1])}` : 'Pas assez de volume pour un intervalle'} · ITM {(itm * 100).toFixed(1)} %</p>
              </div>
            ))}
          </div>
          <p className="text-sm text-gray-200">{msg}{zero}</p>
          <div className="grid md:grid-cols-2 gap-4">
            <Table rows={data.rooms} label="Room" />
            <Table rows={data.formats} label="Format" />
          </div>
          <p className="text-[11px] text-gray-500">* moins de {AN_MIN_N} re-entries : chiffre indicatif, un seul gros score peut le faire basculer. Les add-ons Unibet ne sont pas comptés comme des re-entries.</p>
        </div>
      );
    }

    // ─── Lien winrate en bb/100 → ROI (par session ou par semaine) ───
    function isoWeek(ds) {
      const d = new Date(ds + 'T12:00:00'); const day = (d.getDay() + 6) % 7;
      d.setDate(d.getDate() - day + 3);
      const y = d.getFullYear(), jan4 = new Date(y, 0, 4);
      const w = 1 + Math.round(((d - jan4) / 864e5 - 3 + ((jan4.getDay() + 6) % 7)) / 7);
      return `${y}-S${String(w).padStart(2, '0')}`;
    }
    // Régression pondérée y = a + b·x (poids w) + corrélation pondérée
    function wFit(pts) {
      const W = pts.reduce((s, p) => s + p.w, 0);
      if (!W || pts.length < 3) return null;
      const mx = pts.reduce((s, p) => s + p.w * p.x, 0) / W, my = pts.reduce((s, p) => s + p.w * p.y, 0) / W;
      let sxx = 0, sxy = 0, syy = 0;
      pts.forEach(p => { sxx += p.w * (p.x - mx) ** 2; sxy += p.w * (p.x - mx) * (p.y - my); syy += p.w * (p.y - my) ** 2; });
      if (!sxx) return null;
      const b = sxy / sxx;
      return { a: my - b * mx, b, r: syy ? sxy / Math.sqrt(sxx * syy) : 0, mx, my };
    }

    function BBRoiCard({ tourns }) {
      const [metric, setMetric] = useState('ev');     // 'ev' ou 'won'
      const [unit, setUnit]     = useState('day');    // 'day' (session) ou 'week'
      const [minH, setMinH]     = useState(500);
      const [hover, setHover]   = useState(null);

      const data = useMemo(() => {
        const rows = tourns.filter(t => t.bbHands);
        if (!rows.length) return null;
        const key = t => unit === 'week' ? isoWeek(t.date) : t.date;
        const g = {};
        rows.forEach(t => {
          const k = key(t);
          const o = g[k] || (g[k] = { k, hands: 0, bb: 0, inv: 0, prof: 0, n: 0 });
          o.hands += t.bbHands; o.bb += metric === 'ev' ? (t.bbEV || 0) : (t.bbWon || 0);
          o.inv += t.buyIn * t.nbEntry; o.prof += t.profit; o.n += 1;
        });
        const all = Object.values(g).filter(o => o.inv > 0);
        const pts = all.filter(o => o.hands >= minH).map(o => ({ ...o, x: 100 * o.bb / o.hands, y: o.prof / o.inv, w: o.inv }));
        const fit = wFit(pts);
        let ci = null;
        if (fit && pts.length >= 8) {            // intervalle de la pente : bootstrap sur les points
          const rnd = anRng(99), bs = [];
          for (let i = 0; i < 1000; i++) {
            const s = Array.from({ length: pts.length }, () => pts[(rnd() * pts.length) | 0]);
            const f = wFit(s); if (f) bs.push(f.b);
          }
          ci = [anQuant(bs, 0.025), anQuant(bs, 0.975)];
        }
        // ROI prédit par segment (format, room) avec le modèle, comparé au ROI réel
        const seg = field => {
          const m = {};
          rows.forEach(t => {
            const v = t[field] || '—'; const o = m[v] || (m[v] = { v, hands: 0, bb: 0, inv: 0, prof: 0, n: 0 });
            o.hands += t.bbHands; o.bb += metric === 'ev' ? (t.bbEV || 0) : (t.bbWon || 0);
            o.inv += t.buyIn * t.nbEntry; o.prof += t.profit; o.n += 1;
          });
          return Object.values(m).filter(o => o.inv > 0).map(o => {
            const x = 100 * o.bb / o.hands, roi = o.prof / o.inv, pred = fit ? fit.a + fit.b * x : null;
            return { ...o, x, roi, pred, gap: pred == null ? null : roi - pred };
          }).sort((a, b) => b.hands - a.hands);
        };
        return { pts, fit, ci, nAll: all.length, formats: seg('format'), rooms: seg('room') };
      }, [tourns, metric, unit, minH]);

      if (!data) return null;
      const { pts, fit, ci } = data;
      const pct = (x, d = 1) => `${x > 0 ? '+' : ''}${(x * 100).toFixed(d)} %`;
      const lbl = metric === 'ev' ? 'bb/100 EV' : 'bb/100 réel';
      const uLbl = unit === 'week' ? 'semaine' : 'session';

      // Nuage de points en SVG (échelle commune pour points, axes et droite)
      const Wd = 760, Ht = 320, L = 52, R = 14, T = 14, B = 38;
      const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
      const pad = (lo, hi, f) => { const d = (hi - lo) || 1; return [lo - d * f, hi + d * f]; };
      const [x0, x1] = pts.length ? pad(Math.min(0, ...xs), Math.max(0, ...xs), 0.05) : [-50, 50];
      // axe du ROI : on coupe les 2 % de points extrêmes (une grosse perf écraserait tout le reste) ; ils restent dessinés au bord
      const ysS = [...ys].sort((a, b) => a - b), q = f => ysS.length ? ysS[Math.min(ysS.length - 1, Math.floor(f * (ysS.length - 1)))] : 0;
      const [y0, y1] = pts.length ? pad(Math.min(-1, q(0.02)), Math.max(1, q(0.98)), 0.05) : [-1, 1];
      const sx = x => L + (x - x0) / (x1 - x0) * (Wd - L - R);
      const sy = y => T + (1 - (y - y0) / (y1 - y0)) * (Ht - T - B);
      const ticks = (lo, hi, n) => { const step = Math.pow(10, Math.floor(Math.log10((hi - lo) / n))); const m = [1, 2, 5, 10].find(k => (hi - lo) / (step * k) <= n) * step; const out = []; for (let v = Math.ceil(lo / m) * m; v <= hi; v += m) out.push(+v.toFixed(6)); return out; };
      const maxW = Math.max(1, ...pts.map(p => p.w));
      const rad = w => 3 + 7 * Math.sqrt(w / maxW);

      const strength = r => { const a = Math.abs(r); return a < 0.1 ? 'quasi nul' : a < 0.3 ? 'faible' : a < 0.5 ? 'modéré' : a < 0.7 ? 'net' : 'fort'; };
      const signif = ci && (ci[0] > 0 || ci[1] < 0);

      const SegTable = ({ title, rows }) => (
        <div className="overflow-x-auto rounded-lg border border-gray-700">
          <table className="w-full text-sm whitespace-nowrap" style={{ minWidth: '560px' }}>
            <thead className="bg-gray-800 text-gray-400 text-xs uppercase">
              <tr>{[title, 'Mains', lbl, 'ROI réel', 'ROI attendu', 'Écart'].map((h, i) => <th key={i} className="px-3 py-2 text-left">{h}</th>)}</tr>
            </thead>
            <tbody>
              {rows.map(s => (
                <tr key={s.v} className="border-t border-gray-700">
                  <td className="px-3 py-2 text-gray-200 font-medium">{s.v}</td>
                  <td className="px-3 py-2 text-gray-400">{s.hands.toLocaleString('fr-FR')}</td>
                  <td className={`px-3 py-2 ${s.x >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtBB(s.x)}</td>
                  <td className={`px-3 py-2 font-semibold ${s.roi >= 0 ? 'text-green-400' : 'text-red-400'}`}>{pct(s.roi)}</td>
                  <td className="px-3 py-2 text-gray-300">{s.pred == null ? '—' : pct(s.pred)}</td>
                  <td className="px-3 py-2">{s.gap == null ? '—' : <span className={s.gap >= 0 ? 'text-green-400' : 'text-red-400'}>{pct(s.gap)}</span>}
                    {s.n < 100 && <span className="ml-2 text-xs text-gray-500">({s.n} tournois, peu fiable)</span>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );

      return (
        <div className="bg-gray-800 border border-gray-700 rounded-lg p-4 space-y-4">
          <div className="flex flex-wrap items-end gap-3">
            <p className="text-sm font-semibold text-gray-200 self-center mr-2">Winrate en jetons → ROI : est-ce que tu convertis ?</p>
            <div className="flex gap-1 bg-gray-900 rounded-lg p-1">
              {[['ev', 'bb/100 EV'], ['won', 'bb/100 réel']].map(([v, l]) => (
                <button key={v} onClick={() => setMetric(v)} className={`px-3 py-1 rounded text-xs font-medium ${metric === v ? 'bg-indigo-600 text-white' : 'text-gray-400 hover:text-white'}`}>{l}</button>
              ))}
            </div>
            <div className="flex gap-1 bg-gray-900 rounded-lg p-1">
              {[['day', 'Par session'], ['week', 'Par semaine']].map(([v, l]) => (
                <button key={v} onClick={() => setUnit(v)} className={`px-3 py-1 rounded text-xs font-medium ${unit === v ? 'bg-indigo-600 text-white' : 'text-gray-400 hover:text-white'}`}>{l}</button>
              ))}
            </div>
            <div className="flex items-center gap-2 text-xs text-gray-400">Mains mini par point
              <Sel value={minH} onChange={v => setMinH(Number(v))} options={[200, 500, 1000, 2000].map(v => ({ value: v, label: String(v) }))} />
            </div>
          </div>

          {!fit && <p className="text-sm text-gray-400">Pas assez de {uLbl}s avec au moins {minH} mains pour calculer le lien (il en faut 3).</p>}

          {fit && (<>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              <div className="bg-gray-900 rounded-lg p-3"><p className="text-xs text-gray-500 mb-1">Corrélation (r)</p><p className="text-xl font-bold text-white">{fit.r.toFixed(2)}</p><p className="text-xs text-gray-500">lien {strength(fit.r)}, r² = {(fit.r ** 2 * 100).toFixed(0)} %</p></div>
              <div className="bg-gray-900 rounded-lg p-3"><p className="text-xs text-gray-500 mb-1">+10 {lbl} =</p><p className={`text-xl font-bold ${fit.b >= 0 ? 'text-green-400' : 'text-red-400'}`}>{pct(fit.b * 10)} de ROI</p><p className="text-xs text-gray-500">{ci ? `intervalle 95 % : ${pct(ci[0] * 10, 0)} à ${pct(ci[1] * 10, 0)}` : 'intervalle : trop peu de points'}</p></div>
              <div className="bg-gray-900 rounded-lg p-3"><p className="text-xs text-gray-500 mb-1">ROI à 0 bb/100</p><p className={`text-xl font-bold ${fit.a >= 0 ? 'text-green-400' : 'text-red-400'}`}>{pct(fit.a)}</p><p className="text-xs text-gray-500">ce que rapporte une {uLbl} neutre en jetons</p></div>
              <div className="bg-gray-900 rounded-lg p-3"><p className="text-xs text-gray-500 mb-1">Points analysés</p><p className="text-xl font-bold text-white">{pts.length}</p><p className="text-xs text-gray-500">{uLbl}s ≥ {minH} mains, sur {data.nAll}</p></div>
            </div>

            <div className="overflow-x-auto">
              <svg viewBox={`0 0 ${Wd} ${Ht}`} className="w-full" style={{ minWidth: 520, maxHeight: 360 }} onMouseLeave={() => setHover(null)}>
                <defs><clipPath id="bbroi-clip"><rect x={L} y={T} width={Wd - L - R} height={Ht - T - B} /></clipPath></defs>
                {ticks(y0, y1, 6).map(v => <g key={'y' + v}><line x1={L} x2={Wd - R} y1={sy(v)} y2={sy(v)} stroke="#374151" strokeDasharray="3 3" /><text x={L - 6} y={sy(v) + 3} fill="#9ca3af" fontSize="10" textAnchor="end">{Math.round(v * 100)}%</text></g>)}
                {ticks(x0, x1, 8).map(v => <g key={'x' + v}><line x1={sx(v)} x2={sx(v)} y1={T} y2={Ht - B} stroke="#374151" strokeDasharray="3 3" /><text x={sx(v)} y={Ht - B + 14} fill="#9ca3af" fontSize="10" textAnchor="middle">{v}</text></g>)}
                <line x1={L} x2={Wd - R} y1={sy(0)} y2={sy(0)} stroke="#6b7280" />
                <line x1={sx(0)} x2={sx(0)} y1={T} y2={Ht - B} stroke="#6b7280" />
                <text x={(L + Wd - R) / 2} y={Ht - 6} fill="#9ca3af" fontSize="11" textAnchor="middle">{lbl} de la {uLbl}</text>
                <text x={12} y={(T + Ht - B) / 2} fill="#9ca3af" fontSize="11" textAnchor="middle" transform={`rotate(-90 12 ${(T + Ht - B) / 2})`}>ROI</text>
                {pts.map(p => (
                  <circle key={p.k} cx={sx(p.x)} cy={sy(Math.max(y0, Math.min(y1, p.y)))} r={rad(p.w)}
                    fill={p.y >= 0 ? '#22c55e' : '#ef4444'} fillOpacity={hover && hover.k === p.k ? 0.95 : 0.55} stroke={p.y >= 0 ? '#16a34a' : '#dc2626'}
                    onMouseEnter={() => setHover(p)} />
                ))}
                <line x1={sx(x0)} y1={sy(fit.a + fit.b * x0)} x2={sx(x1)} y2={sy(fit.a + fit.b * x1)} stroke="#a5b4fc" strokeWidth="2" clipPath="url(#bbroi-clip)" />
              </svg>
            </div>
            <p className="text-xs text-gray-400 h-4">{hover
              ? `${unit === 'week' ? 'Semaine ' + hover.k : new Date(hover.k + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' })} · ${hover.n} tournois · ${hover.hands.toLocaleString('fr-FR')} mains · ${fmtBB(hover.x)} ${lbl} · ROI ${pct(hover.y)} · investi ${Math.round(hover.inv)} €`
              : 'Un point = une ' + uLbl + ' (taille = montant investi). Droite violette : régression pondérée par l\'investi.'}</p>

            <div className="text-sm text-gray-300 bg-gray-900 rounded-lg p-3 space-y-1">
              <p>
                {signif
                  ? <>Le lien est <b>{fit.b > 0 ? 'positif' : 'négatif'} et significatif</b> : en moyenne, une {uLbl} à +10 {lbl} de plus rapporte {pct(fit.b * 10)} de ROI en plus.</>
                  : <>Le lien n'est <b>pas encore démontré</b> avec ce volume : l'intervalle de la pente contient 0. Le ROI d'une {uLbl} dépend encore surtout de quelques gros scores.</>}
                {' '}Ton {lbl} explique environ {(fit.r ** 2 * 100).toFixed(0)} % des écarts de ROI entre {uLbl}s ; le reste vient des places payées, de l'ICM, des bounties et de la variance.
              </p>
              <p className="text-gray-400">Tableaux ci-dessous : le ROI que le modèle attend d'après ton {lbl} dans chaque segment, comparé à ton ROI réel. Un écart positif veut dire que tu transformes mieux tes jetons en argent dans ce segment (tables finales, ICM, bounties) ; négatif, moins bien. Avec moins de 100 tournois, l'écart reste surtout de la variance.</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <SegTable title="Format" rows={data.formats} />
              <SegTable title="Room" rows={data.rooms} />
            </div>
          </>)}
        </div>
      );
    }

    function AnalyseTab({ playedTournaments }) {
      const [period, setPeriod] = useState('all');
      const [fRoom, setFRoom]   = useState('');
      const [paramId, setParamId] = useState('field');
      const [showHelp, setShowHelp] = useState(false);
      const [res, setRes] = useState(null);
      const [summary, setSummary] = useState(null);
      const [busy, setBusy] = useState(false);

      const tourns = useMemo(() => {
        let cutoff = null;
        if (period !== 'all') { const d = new Date(); d.setMonth(d.getMonth() - Number(period)); cutoff = toStr(d); }
        return playedTournaments.filter(t => t.buyIn > 0 && t.nbEntry > 0
          && (!cutoff || t.date >= cutoff) && (!fRoom || t.room === fRoom));
      }, [playedTournaments, period, fRoom]);

      const global = useMemo(() => {
        if (!tourns.length) return null;
        const items = tourns.map(t => ({ inv: t.buyIn * t.nbEntry, prof: t.profit }));
        const inv = items.reduce((a, x) => a + x.inv, 0), prof = items.reduce((a, x) => a + x.prof, 0);
        const bs = anBootRoi(items, anRng(7));
        const ci = [anQuant(bs, 0.025), anQuant(bs, 0.975)];
        const half = (ci[1] - ci[0]) / 2;
        const need = half > 0 ? Math.round(tourns.length * Math.pow(half / 0.05, 2)) : null;
        return { n: tourns.length, inv, prof, roi: inv ? prof / inv : 0, ci, need };
      }, [tourns]);

      useEffect(() => {
        setBusy(true);
        const id = setTimeout(() => {
          const param = AN_PARAMS.find(p => p.id === paramId);
          setRes(anAnalyse(tourns, param, 42));
          const found = [];
          AN_PARAMS.filter(p => p.id !== 'mois').forEach(p => {
            if (fRoom && (p.id === 'room' || p.id === 'roomfield' || p.id === 'roombuyin')) return;
            anAnalyse(tourns, p, 42).forEach(r => {
              if (!r.small && r.pAdj != null && r.pAdj < 0.05) found.push({ param: p.label, ...r, kind: 'roi' });
              else if (!r.small && r.itmPAdj != null && r.itmPAdj < 0.05) found.push({ param: p.label, ...r, kind: 'itm' });
            });
          });
          setSummary(found);
          setBusy(false);
        }, 30);
        return () => clearTimeout(id);
      }, [tourns, paramId, fRoom]);

      const pct = (x, d = 1) => `${x > 0 ? '+' : ''}${(x * 100).toFixed(d)} %`;
      const verdict = r => {
        if (r.small) return <Badge cls="bg-gray-700 text-gray-300">Trop peu de tournois</Badge>;
        if (r.pAdj < 0.05) return <Badge cls={r.roi > r.restRoi ? 'bg-green-700 text-white' : 'bg-red-700 text-white'}>{r.roi > r.restRoi ? 'Meilleur, significatif' : 'Moins bon, significatif'}</Badge>;
        if (r.p < 0.10) return <Badge cls="bg-yellow-700 text-white">Tendance à confirmer</Badge>;
        return <Badge cls="bg-gray-700 text-gray-300">Pas de différence prouvée</Badge>;
      };
      const rooms = [...new Set(playedTournaments.map(t => t.room))];
      // échelle commune pour les barres d'intervalle
      const span = useMemo(() => {
        const v = (res || []).filter(r => r.ci).flatMap(r => r.ci).concat(global ? global.ci : []);
        if (!v.length) return [-1, 1];
        return [Math.min(-0.5, ...v), Math.max(0.5, ...v)];
      }, [res, global]);
      const X = x => `${((x - span[0]) / (span[1] - span[0])) * 100}%`;

      return (
        <div className="p-4 space-y-6">
          <div className="flex flex-wrap gap-3 items-end">
            <h2 className="text-lg font-bold text-indigo-300 self-center">🔬 Analyse statistique</h2>
            <div>
              <p className="text-xs text-gray-500 mb-1">Période</p>
              <div className="flex gap-1 bg-gray-800 rounded-lg p-1">
                {[['3','3 mois'],['6','6 mois'],['all','Tout']].map(([v,l]) => (
                  <button key={v} onClick={() => setPeriod(v)}
                    className={`px-3 py-1 rounded text-xs font-medium ${period===v ? 'bg-indigo-600 text-white' : 'text-gray-400 hover:text-white'}`}>{l}</button>
                ))}
              </div>
            </div>
            <div>
              <p className="text-xs text-gray-500 mb-1">Room</p>
              <Sel value={fRoom} onChange={setFRoom} options={[{ value:'', label:'Toutes' }, ...rooms.map(r => ({ value:r, label:r }))]} />
            </div>
            <div>
              <p className="text-xs text-gray-500 mb-1">Comparer selon</p>
              <Sel value={paramId} onChange={setParamId} options={AN_PARAMS.map(p => ({ value:p.id, label:p.label }))} />
            </div>
            <button onClick={() => setShowHelp(h => !h)} className="text-xs text-indigo-300 underline self-center">{showHelp ? 'Masquer' : 'Comment lire cette page ?'}</button>
          </div>

          {showHelp && (
            <div className="bg-gray-800 border border-gray-700 rounded-lg p-4 text-sm text-gray-300 space-y-2">
              <p><b>ROI</b> = profit total ÷ investi total du segment. Les freerolls (buy-in 0 €) sont exclus.</p>
              <p><b>Intervalle à 95 %</b> : la zone où se situe probablement ton vrai ROI. Il est calculé en rééchantillonnant tes tournois {AN_B} fois (bootstrap), une méthode adaptée aux résultats MTT, dominés par quelques gros scores.</p>
              <p><b>Différence significative</b> : le ROI du segment est comparé au ROI de tous tes autres tournois. Le verdict tient compte du nombre de comparaisons faites en même temps (correction de Holm), pour éviter les fausses découvertes dues au hasard.</p>
              <p><b>Tendance à confirmer</b> : un écart qui serait peu probable par hasard s'il était seul, mais pas assez net pour conclure. À surveiller avec plus de volume.</p>
              <p>Un segment doit compter au moins {AN_MIN_N} tournois pour recevoir un verdict : en dessous, l'absence de gros score rend les calculs trompeurs.</p>
              <p><b>ITM</b> : bien moins variable que le ROI, il devient significatif beaucoup plus vite. Un écart d'ITM significatif est souvent le premier signal fiable.</p>
            </div>
          )}

          {global && (
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              <div className="bg-gray-800 border border-gray-700 rounded-lg p-4"><p className="text-xs text-gray-500 mb-1">Tournois analysés</p><p className="text-2xl font-bold text-white">{global.n}</p></div>
              <div className="bg-gray-800 border border-gray-700 rounded-lg p-4"><p className="text-xs text-gray-500 mb-1">ROI global</p><p className={`text-2xl font-bold ${global.roi >= 0 ? 'text-green-400' : 'text-red-400'}`}>{pct(global.roi)}</p></div>
              <div className="bg-gray-800 border border-gray-700 rounded-lg p-4"><p className="text-xs text-gray-500 mb-1">Intervalle à 95 %</p><p className="text-xl font-bold text-indigo-300">{pct(global.ci[0], 0)} à {pct(global.ci[1], 0)}</p></div>
              <div className="bg-gray-800 border border-gray-700 rounded-lg p-4"><p className="text-xs text-gray-500 mb-1">Tournois pour ±5 pts de précision</p><p className="text-2xl font-bold text-white">{global.need ? `≈ ${global.need.toLocaleString('fr-FR')}` : '—'}</p></div>
            </div>
          )}

          <div className="bg-gray-800 border border-gray-700 rounded-lg p-4">
            <p className="text-sm font-semibold text-gray-200 mb-2">Ce qui ressort vraiment (tous paramètres)</p>
            {busy && <p className="text-xs text-gray-500">Calcul en cours…</p>}
            {!busy && summary && summary.length === 0 && (
              <p className="text-sm text-gray-400">Aucune différence significative pour l'instant. Les écarts visibles peuvent encore s'expliquer par la variance : il faut plus de volume.</p>
            )}
            {!busy && summary && summary.length > 0 && (
              <ul className="space-y-1 text-sm">
                {summary.map((s, i) => (
                  <li key={i} className={s.kind === 'roi' ? (s.roi > s.restRoi ? 'text-green-400' : 'text-red-400') : (s.itm > 0.5 ? 'text-green-400' : 'text-indigo-300')}>
                    {s.kind === 'roi'
                      ? <>• <b>{s.param} : {s.key}</b> : ROI {pct(s.roi)} contre {pct(s.restRoi)} ailleurs ({s.n} tournois)</>
                      : <>• <b>{s.param} : {s.key}</b> : ITM {(s.itm * 100).toFixed(1)} %, différent du reste ({s.n} tournois)</>}
                  </li>
                ))}
              </ul>
            )}
          </div>

          <div className="overflow-x-auto rounded-lg border border-gray-700">
            <table className="w-full text-sm" style={{ minWidth: '980px' }}>
              <thead className="bg-gray-800 text-gray-400 text-xs uppercase">
                <tr>{['Segment','Tournois','Investi','Profit','ROI','Intervalle 95 %','','ITM','Verdict ROI'].map((h, i) => <th key={i} className="px-3 py-2 text-left">{h}</th>)}</tr>
              </thead>
              <tbody>
                {(res || []).map(r => (
                  <tr key={r.key} className="border-t border-gray-700">
                    <td className="px-3 py-2 text-gray-200 font-medium">{r.key}</td>
                    <td className="px-3 py-2 text-gray-400">{r.n}</td>
                    <td className="px-3 py-2 text-gray-400">{Math.round(r.inv)} €</td>
                    <td className={`px-3 py-2 ${r.prof >= 0 ? 'text-green-400' : 'text-red-400'}`}>{r.prof >= 0 ? '+' : ''}{Math.round(r.prof)} €</td>
                    <td className={`px-3 py-2 font-bold ${r.roi >= 0 ? 'text-green-400' : 'text-red-400'}`}>{pct(r.roi)}</td>
                    <td className="px-3 py-2 text-xs text-gray-400">{r.ci ? `${pct(r.ci[0], 0)} à ${pct(r.ci[1], 0)}` : '—'}</td>
                    <td className="px-3 py-2" style={{ width: 180 }}>
                      {r.ci && (
                        <div className="relative h-3">
                          <div className="absolute top-1/2 h-px bg-gray-600" style={{ left: 0, right: 0 }} />
                          <div className="absolute top-0 bottom-0 w-px bg-gray-400" style={{ left: X(0) }} />
                          <div className={`absolute top-1 h-1 rounded ${r.roi >= 0 ? 'bg-green-500/60' : 'bg-red-500/60'}`} style={{ left: X(r.ci[0]), width: `calc(${X(r.ci[1])} - ${X(r.ci[0])})` }} />
                          <div className="absolute top-0 h-3 w-1 rounded bg-white" style={{ left: X(r.roi) }} />
                        </div>
                      )}
                    </td>
                    <td className="px-3 py-2 text-xs text-gray-300">
                      {(r.itm * 100).toFixed(1)} %
                      {!r.small && r.itmPAdj < 0.05 && <span className="ml-1 text-indigo-300 font-semibold">(significatif)</span>}
                    </td>
                    <td className="px-3 py-2">{verdict(r)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <p className="text-xs text-gray-500">Barre : intervalle à 95 % du ROI, trait blanc : ROI observé, trait vertical : 0 %. Un segment est comparé à l'ensemble de tes autres tournois sur la même période.</p>
          {tourns.length > 0 && <ReentryCard tourns={tourns} />}
          {tourns.length > 0 && <BBRoiCard tourns={tourns} />}
        </div>
      );
    }

    // ─── LOGIN (compte Google via Firebase Authentication) ────────
    const fbAuth = firebase.auth();
    const ptSignOut = () => {
      try { Object.keys(localStorage).filter(k => k.startsWith('pt_')).forEach(k => localStorage.removeItem(k)); } catch {}
      fbAuth.signOut();
    };

    function LoginScreen() {
      const [err, setErr] = useState('');
      const [busy, setBusy] = useState(false);
      const login = async () => {
        setErr(''); setBusy(true);
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        try {
          await fbAuth.signInWithPopup(provider);
        } catch (e) {
          if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/cancelled-popup-request'].includes(e.code)) {
            await fbAuth.signInWithRedirect(provider);
          } else if (e.code !== 'auth/popup-closed-by-user') {
            setErr(e.message || 'Connexion impossible');
          }
        }
        setBusy(false);
      };
      return (
        <div className="min-h-screen bg-gray-900 flex items-center justify-center p-4">
          <div className="bg-gray-800 border border-gray-700 rounded-2xl p-8 w-80 shadow-2xl space-y-6">
            <div className="text-center space-y-1">
              <span className="text-5xl">♠</span>
              <h1 className="text-2xl font-bold text-green-400 tracking-wide">PokerTrack</h1>
              <p className="text-xs text-gray-500">Accès privé</p>
            </div>
            <button onClick={login} disabled={busy}
              className="w-full bg-white hover:bg-gray-100 text-gray-800 font-semibold py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2 disabled:opacity-60">
              <span className="text-lg font-bold" style={{ color: '#4285F4' }}>G</span> {busy ? 'Connexion…' : 'Se connecter avec Google'}
            </button>
            {err && <p className="text-red-400 text-xs text-center">{err}</p>}
          </div>
        </div>
      );
    }

    function DeniedScreen({ user }) {
      return (
        <div className="min-h-screen bg-gray-900 flex items-center justify-center p-4">
          <div className="bg-gray-800 border border-gray-700 rounded-2xl p-8 w-96 shadow-2xl space-y-4 text-center">
            <span className="text-4xl">🔒</span>
            <p className="text-gray-200">Ce compte n'a pas accès à PokerTrack.</p>
            <p className="text-xs text-gray-500">{user.email}<br />Identifiant : <span className="font-mono select-all">{user.uid}</span></p>
            <button onClick={ptSignOut} className="text-sm text-green-400 underline">Changer de compte</button>
          </div>
        </div>
      );
    }

    function PokerTracker() {
      const [user, setUser] = useState(undefined);
      const [denied, setDenied] = useState(false);
      useEffect(() => fbAuth.onAuthStateChanged(u => { setUser(u || null); setDenied(false); }), []);
      useEffect(() => {
        if (!user) return;
        // test d'accès : si les règles Firestore refusent ce compte, on l'indique clairement
        db.collection('pt').doc('pt_sessions').get().then(() => setDenied(false)).catch(e => { if (e.code === 'permission-denied') setDenied(true); });
      }, [user]);
      if (user === undefined) return <div className="min-h-screen bg-gray-900 flex items-center justify-center text-gray-500 text-sm">Chargement…</div>;
      if (!user) return <LoginScreen />;
      if (denied) return <DeniedScreen user={user} />;
      return <PokerApp user={user} />;
    }

    // ─── TOURNOIS À COMPLÉTER ─────────────────────────────────────
    // Le script d'import marque (aCompleter) les tournois dont le résultat n'est écrit nulle part
    // dans les fichiers (résumé Winamax absent, place PMU non écrite, export Betclic coupé…).
    // Les réponses vont dans pt_corrections : le script les réapplique à chaque import.
    function applyCorrection(t, c) {
      const n = { ...t };
      if (c.out) { n.prize = 0; }
      else {
        if (c.place) n.place = c.place;
        if (c.prize != null) n.prize = c.prize;
        if (c.bounty != null) n.bounty = c.bounty;
      }
      n.gains  = Math.round(((n.prize || 0) + (n.bounty || 0)) * 100) / 100;
      n.profit = Math.round((n.gains - (n.buyIn || 0) * (n.nbEntry || 1)) * 100) / 100;
      n.itm = (n.prize || 0) > 0;
      delete n.aCompleter; delete n.probaITM;
      n.notes = [String(n.notes || '').split('; ').filter(x => x && !/résumé|place non trouvée|A COMPLETER|pas de fin/.test(x)).join('; '),
                 'résultat complété dans l\'app'].filter(Boolean).join('; ');
      return n;
    }

    function CompleteRow({ t, onSave }) {
      const [place, setPlace]   = useState('');
      const [prize, setPrize]   = useState('');
      const [bounty, setBounty] = useState(t.bounty ? String(t.bounty).replace('.', ',') : '');
      const num = v => { const x = parseFloat(String(v).replace(',', '.')); return isNaN(x) ? null : x; };
      const p = t.probaITM;
      const pc = p == null ? null : Math.round(p * 100);
      const col = p == null ? 'text-gray-500' : p >= 0.6 ? 'text-green-400' : p >= 0.3 ? 'text-yellow-400' : 'text-gray-500';
      const ok = num(prize) != null || num(place) != null;
      return (
        <div className="border border-gray-800 rounded-lg p-3 bg-gray-900">
          <div className="flex flex-wrap items-baseline gap-x-2 gap-y-0.5 text-sm">
            <span className="text-gray-400">{String(t.date || '').split('-').reverse().join('/')}</span>
            <span className="text-gray-500">{t.startTime}{t.endTime ? ' → ' + t.endTime : ''}</span>
            <span className="text-xs px-1.5 py-0.5 rounded bg-gray-800 text-gray-300">{t.room}</span>
            <span className="font-medium text-white">{t.name}</span>
            <span className="text-gray-400">{t.buyIn ? t.buyIn + ' €' : 'Day 2'}{t.nbEntry > 1 ? ' ×' + t.nbEntry : ''}</span>
            <span className="text-gray-500">{t.hands} mains</span>
            {pc != null && <span className={`ml-auto text-xs ${col}`}>{pc} % de chances d'être payé</span>}
          </div>
          <div className="text-xs text-gray-500 mt-0.5">{t.aCompleter}</div>
          <div className="flex flex-wrap items-end gap-2 mt-2">
            <label className="text-xs text-gray-500">Place<br/>
              <input value={place} onChange={e => setPlace(e.target.value)} inputMode="numeric"
                className="w-16 bg-gray-800 border border-gray-700 rounded px-2 py-1 text-sm text-white" /></label>
            <label className="text-xs text-gray-500">Gain place (€)<br/>
              <input value={prize} onChange={e => setPrize(e.target.value)} inputMode="decimal"
                className="w-24 bg-gray-800 border border-gray-700 rounded px-2 py-1 text-sm text-white" /></label>
            <label className="text-xs text-gray-500">Bounties (€)<br/>
              <input value={bounty} onChange={e => setBounty(e.target.value)} inputMode="decimal"
                className="w-24 bg-gray-800 border border-gray-700 rounded px-2 py-1 text-sm text-white" /></label>
            <button disabled={!ok}
              onClick={() => onSave(t, { place: num(place) ? Math.round(num(place)) : null, prize: num(prize) ?? 0, bounty: num(bounty) ?? (t.bounty || 0) })}
              className={`px-3 py-1.5 rounded text-sm font-medium ${ok ? 'bg-green-600 hover:bg-green-500 text-white' : 'bg-gray-800 text-gray-600 cursor-not-allowed'}`}>Valider</button>
            <button onClick={() => onSave(t, { out: true })}
              className="px-3 py-1.5 rounded text-sm bg-gray-800 hover:bg-gray-700 text-gray-300">Hors des places</button>
          </div>
        </div>
      );
    }

    function CompleteModal({ pending, onSave, onSaveMany, onClose }) {
      const sorted = [...pending].sort((a, b) => ((b.probaITM ?? -1) - (a.probaITM ?? -1)) || String(b.date).localeCompare(String(a.date)));
      const likely   = sorted.filter(t => (t.probaITM ?? 0) >= 0.3);
      const unlikely = sorted.filter(t => (t.probaITM ?? 0) < 0.3);
      const [showAll, setShowAll] = useState(false);
      return (
        <div className="fixed inset-0 z-50 bg-black/70 flex items-start justify-center p-3 overflow-y-auto" onClick={onClose}>
          <div className="bg-gray-950 border border-gray-800 rounded-xl w-full max-w-3xl my-6" onClick={e => e.stopPropagation()}>
            <div className="flex items-start gap-3 p-4 border-b border-gray-800">
              <div>
                <h2 className="text-lg font-bold text-white">Tournois à compléter ({pending.length})</h2>
                <p className="text-xs text-gray-500 mt-1">Ces résultats ne sont écrits dans aucun fichier de la room. Tes réponses sont gardées et réappliquées à chaque import.</p>
              </div>
              <button onClick={onClose} className="ml-auto text-gray-500 hover:text-white text-xl leading-none">×</button>
            </div>
            <div className="p-4 space-y-3">
              {likely.length > 0 && <h3 className="text-sm font-semibold text-yellow-400">Probablement payés ({likely.length})</h3>}
              {likely.map(t => <CompleteRow key={t.id} t={t} onSave={onSave} />)}
              {unlikely.length > 0 && (
                <div className="pt-2">
                  <div className="flex flex-wrap items-center gap-2">
                    <h3 className="text-sm font-semibold text-gray-400">Probablement éliminés hors des places ({unlikely.length})</h3>
                    <button onClick={() => { if (confirm(`Marquer ces ${unlikely.length} tournois comme « hors des places » ?`)) onSaveMany(unlikely); }}
                      className="ml-auto px-3 py-1.5 rounded text-sm bg-gray-800 hover:bg-gray-700 text-gray-200">Tous hors des places</button>
                    <button onClick={() => setShowAll(v => !v)} className="text-xs text-gray-500 hover:text-gray-300 underline">{showAll ? 'masquer' : 'voir le détail'}</button>
                  </div>
                  {showAll && <div className="space-y-3 mt-3">{unlikely.map(t => <CompleteRow key={t.id} t={t} onSave={onSave} />)}</div>}
                </div>
              )}
              {pending.length === 0 && <p className="text-sm text-green-400">Tout est complet ✓</p>}
            </div>
          </div>
        </div>
      );
    }

    // ─── ROOT ─────────────────────────────────────────────────────
    function PokerApp({ user }) {
      const [activeTab, setActiveTab]       = useState('mysessions');
      const [savedGrids, setSavedGrids]                = usePersist(LS_KEYS.grids,    INIT_GRIDS);
      const [sessions,   setSessions,   sessLoaded]   = usePersist(LS_KEYS.sessions,  INIT_SESSIONS);
      const [played,     setPlayed,     playedLoaded] = usePersistChunked(LS_KEYS.played, INIT_PLAYED);
      const [plans,      setPlans]                    = usePersist(LS_KEYS.plans, []);
      const [corrections, setCorrections]             = usePersist('pt_corrections', {});
      const [showComplete, setShowComplete] = useState(false);
      const pendingCompl = useMemo(() => played.filter(t => t && t.aCompleter && !(corrections || {})[t.id]), [played, corrections]);
      const nLikely = pendingCompl.filter(t => (t.probaITM ?? 0) >= 0.3).length;
      // s'ouvre tout seul une fois par visite s'il reste des tournois probablement payés à compléter
      useEffect(() => {
        if (!playedLoaded || !nLikely) return;
        try { if (sessionStorage.getItem('pt_compl_seen')) return; sessionStorage.setItem('pt_compl_seen', '1'); } catch {}
        setShowComplete(true);
      }, [playedLoaded, nLikely]);
      const saveCorrections = (list, data) => {
        const at = Date.now();
        setCorrections(c => { const n = { ...(c || {}) }; list.forEach(t => { n[t.id] = { ...data(t), at }; }); return n; });
        const byId = new Map(list.map(t => [t.id, data(t)]));
        setPlayed(prev => prev.map(t => byId.has(t.id) ? applyCorrection(t, byId.get(t.id)) : t));
      };
      const [online, setOnline]             = useState(navigator.onLine);
      const [fbError, setFbError]           = useState(false);
      useEffect(() => {
        const on  = () => setOnline(true);
        const off = () => setOnline(false);
        window.addEventListener('online', on);
        window.addEventListener('offline', off);
        return () => { window.removeEventListener('online', on); window.removeEventListener('offline', off); };
      }, []);
      useEffect(() => {
        const h = () => setFbError(true);
        window.addEventListener('pt-fb-error', h);
        return () => window.removeEventListener('pt-fb-error', h);
      }, []);

      // ── Réparation automatique des sessions orphelines ──
      // Attend que Firebase ait répondu pour les deux collections avant de réparer.
      useEffect(() => {
        if (!sessLoaded || !playedLoaded) return;
        const existingCodes = new Set(sessions.map(s => s.code));
        const orphaned = [...new Set(played.map(t => t.session))]
          .filter(code => code && !existingCodes.has(code));
        if (!orphaned.length) return;
        setSessions(prev => {
          const prevCodes = new Set(prev.map(s => s.code));
          const toAdd = orphaned
            .filter(code => !prevCodes.has(code))
            .map(code => {
              const date = played.filter(t => t.session === code)[0]?.date || todayStr;
              return {
                id: uid(),
                code,
                date,
                type: code.startsWith('G') ? 'Grind' : 'Travail',
                start: '', end: '',
                typeSession: 'Jour',
                hands: 0,
                duration: '',
              };
            });
          return toAdd.length ? [...prev, ...toAdd] : prev;
        });
      }, [sessLoaded, playedLoaded, sessions, played]);

      const TABS = [
        { id:'mysessions', emoji:'🗓️', label:'Mes sessions'      },
        { id:'planner',   emoji:'🧭', label:'Planifier'          },
        { id:'sessions',  emoji:'🎯', label:'Journal'            },
        { id:'dashboard', emoji:'📊', label:'Dashboard'          },
        { id:'records',   emoji:'🏆', label:'Records'            },
        { id:'analyse',   emoji:'🔬', label:'Analyse'            },
      ];

      return (
        <div className="min-h-screen bg-gray-900 text-white">

          {/* ── Header ── */}
          <header className="bg-gray-950 border-b border-gray-800 px-4 py-2.5 flex items-center gap-3">
            <span className="text-2xl leading-none">♠</span>
            <div>
              <h1 className="text-lg font-bold text-green-400 tracking-wide leading-none">PokerTrack</h1>
              <p className="text-xs text-gray-600 leading-none mt-0.5 hidden sm:block">Tournament Tracker</p>
            </div>
            <div className="ml-auto flex items-center gap-3">
              {/* Stats — masquées sur mobile */}
              <div className="hidden md:flex gap-3 text-xs text-gray-600">
                <span>{sessions.length} sessions</span>
                <span>·</span>
                <span>{played.length} tournois</span>
              </div>
              {/* Tournois à compléter */}
              {pendingCompl.length > 0 && (
                <button onClick={() => setShowComplete(true)}
                  className={`text-xs px-2 py-1 rounded border ${nLikely ? 'border-yellow-600 text-yellow-400 hover:bg-yellow-900/30' : 'border-gray-700 text-gray-400 hover:bg-gray-800'}`}
                  title="Tournois dont le résultat manque dans les fichiers des rooms">
                  ⚠ {pendingCompl.length} à compléter
                </button>
              )}
              {/* Sync */}
              {fbError ? (
                <div className="flex items-center gap-1.5 text-xs text-red-400" title="Erreur de synchronisation Firebase — données sauvées localement uniquement">
                  <span className="w-2 h-2 rounded-full flex-shrink-0 bg-red-400 animate-pulse" />
                  <span className="hidden sm:inline">⚠ Non sync</span>
                </div>
              ) : (
                <div className="flex items-center gap-1.5 text-xs" title={online ? 'Synchronisé' : 'Hors-ligne'}>
                  <span className={`w-2 h-2 rounded-full flex-shrink-0 ${online ? 'bg-green-400' : 'bg-gray-600'}`} />
                  <span className={`hidden sm:inline ${online ? 'text-green-500' : 'text-gray-600'}`}>{online ? '☁ Sync' : 'Hors-ligne'}</span>
                </div>
              )}
              {/* Lock */}
              <button onClick={() => { if (confirm(`Se déconnecter de ${user.email} ?`)) ptSignOut(); }}
                className="text-gray-600 hover:text-gray-400 transition-colors text-sm" title={`Connecté : ${user.email} · se déconnecter`}>🔒</button>
              {/* Reset — masqué sur mobile */}
              <button onClick={() => { if (confirm('Réinitialiser toutes les données ?')) { setSavedGrids(INIT_GRIDS); setSessions(INIT_SESSIONS); setPlayed(INIT_PLAYED); }}}
                className="hidden sm:inline text-xs text-gray-600 hover:text-red-400 transition-colors" title="Reset">↺</button>
            </div>
          </header>

          {/* ── Nav desktop (top) ── */}
          <nav className="hidden md:flex bg-gray-900 border-b border-gray-800 px-2 gap-0.5">
            {TABS.map(t => (
              <button key={t.id} onClick={() => setActiveTab(t.id)}
                className={`px-5 py-3 text-sm font-medium border-b-2 transition-colors whitespace-nowrap flex items-center gap-1.5
                  ${activeTab===t.id ? 'border-green-500 text-green-400' : 'border-transparent text-gray-400 hover:text-gray-200'}`}>
                <span>{t.emoji}</span>{t.label}
              </button>
            ))}
          </nav>

          {/* ── Contenu principal ── */}
          <main className="max-w-screen-xl mx-auto pb-20 md:pb-0">
            <div className={activeTab==='mysessions' ? '' : 'hidden'}><MySessionsTab sessions={sessions} playedTournaments={played} /></div>
            <div className={activeTab==='planner'   ? '' : 'hidden'}>{activeTab==='planner' && <PlannerTab playedTournaments={played} plans={plans} setPlans={setPlans} />}</div>
            <div className={activeTab==='sessions'  ? '' : 'hidden'}><SessionsTab sessions={sessions} setSessions={setSessions} playedTournaments={played} setPlayed={setPlayed} /></div>
            <div className={activeTab==='dashboard' ? '' : 'hidden'}><DashboardTab sessions={sessions} playedTournaments={played} /></div>
            <div className={activeTab==='records'   ? '' : 'hidden'}><RecordsTab sessions={sessions} playedTournaments={played} /></div>
            <div className={activeTab==='analyse'   ? '' : 'hidden'}>{activeTab==='analyse' && <AnalyseTab playedTournaments={played} />}</div>
          </main>

          {showComplete && (
            <CompleteModal pending={pendingCompl}
              onSave={(t, c) => saveCorrections([t], () => c)}
              onSaveMany={list => saveCorrections(list, () => ({ out: true }))}
              onClose={() => setShowComplete(false)} />
          )}

          {/* ── Nav mobile (bottom) ── */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-gray-950 border-t border-gray-800 flex z-40">
            {TABS.map(t => (
              <button key={t.id} onClick={() => setActiveTab(t.id)}
                className={`flex-1 flex flex-col items-center justify-center py-2 gap-0.5 transition-colors
                  ${activeTab===t.id ? 'text-green-400' : 'text-gray-500'}`}>
                <span className="text-xl leading-none">{t.emoji}</span>
                <span className="text-[10px] font-medium leading-none truncate w-full text-center px-1">
                  {t.label.split(' ')[0]}
                </span>
              </button>
            ))}
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PokerTracker />);
  </script>
</body>
</html>
